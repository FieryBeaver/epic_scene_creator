name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build the standalone board
        run: npm run build

      - name: Upload dist/index.html
        uses: actions/upload-artifact@v4
        with:
          name: epic-scene-creator-standalone
          path: dist/index.html
          if-no-files-found: error
