<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дошка сцен — Гробниця Дев'яти Богів</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1311; --stone:#18201C; --stone2:#212B25; --stone3:#2C382F;
  --line:#3A4941; --bone:#EAE3D2; --dim:#95A096;
  --jade:#54BE9B; --ochre:#D08A34; --blood:#C0524A; --sky:#6A9BD1; --plum:#9B7BC4;
  --r:6px;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--ink);color:var(--bone);font-family:var(--sans);font-size:13.5px;line-height:1.45;
  overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--stone3);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
#app{display:grid;grid-template-rows:auto 1fr;height:100%}
#top{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:linear-gradient(180deg,#1D2621,#141A17);border-bottom:1px solid var(--line);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
}
#top::-webkit-scrollbar{display:none}
#top>*{flex:0 0 auto}
#top .spacer{flex:1 1 auto;min-width:6px}
#top h1{
  font-family:var(--serif);font-weight:600;font-size:17px;margin:0 14px 0 0;letter-spacing:.2px;
  white-space:nowrap;
}
#top h1 span{color:var(--jade)}
.spacer{flex:1}
.btn{
  background:var(--stone2);border:1px solid var(--line);border-radius:var(--r);
  padding:5px 11px;color:var(--bone);
}
.btn:hover{background:var(--stone3);border-color:#4E6155}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,
[tabindex]:focus-visible{outline:2px solid var(--jade);outline-offset:1px}
.btn.acc{background:#20463A;border-color:#2F6E58;color:#BFF0DE}
.btn.acc:hover{background:#276E56}
.btn.warn{color:#F0B9B4;border-color:#5C302C}
.btn.on{background:#2F6E58;border-color:#54BE9B;color:#DFF7EE}
.btn.sm{padding:2px 7px;font-size:12px;border-radius:4px}

#main{display:grid;grid-template-columns:var(--railW,288px) 6px 1fr 6px var(--inspW,340px);min-height:0}
#rail,#insp{background:var(--stone);overflow:auto;overflow-x:hidden;min-height:0;min-width:0;
  overscroll-behavior:contain}
#rail{border-right:1px solid var(--line)}
#insp{border-left:1px solid var(--line)}
#boardWrap{min-width:0}
.gut{background:var(--stone);cursor:col-resize;touch-action:none;position:relative}
.gut::after{content:"";position:absolute;inset:0;background:var(--line);
  width:1px;left:50%;transition:background .12s,width .12s}
.gut:hover::after,.gut.drag::after{background:var(--jade);width:3px;left:calc(50% - 1px)}
body.resizing{cursor:col-resize;user-select:none}
#main.collapsedL{grid-template-columns:0 6px 1fr 6px var(--inspW,340px)}
#main.collapsedR{grid-template-columns:var(--railW,288px) 6px 1fr 6px 0}
#main.collapsedL.collapsedR{grid-template-columns:0 6px 1fr 6px 0}
#main.collapsedL #rail,#main.collapsedR #insp{border:0;overflow:hidden}

/* ---------- rail tabs ---------- */
#tabs{display:flex;position:sticky;top:0;background:var(--stone);z-index:5;border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{
  flex:1 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:9px 9px;
  color:var(--dim);font-size:12px;white-space:nowrap;
}
#tabs button.plus{flex:0 0 auto;padding:9px 11px;font-size:15px;line-height:1}
#tabs button.on{color:var(--bone);border-bottom-color:var(--jade)}
.pane{display:none;padding:10px}
.pane.on{display:block}
.pane h3{
  font-family:var(--serif);font-size:14px;font-weight:600;margin:2px 0 8px;color:var(--bone);
}
.hint{color:var(--dim);font-size:12px;margin:0 0 9px}

/* ---------- board ---------- */
#boardWrap{position:relative;overflow:hidden;background:
  radial-gradient(ellipse at 50% 0%,#182320 0%,var(--ink) 70%);cursor:grab}
#boardWrap.panning{cursor:grabbing}
#boardWrap.linking{cursor:crosshair}
#grid{position:absolute;inset:0;pointer-events:none;opacity:.5}
#world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
#edges *{pointer-events:none}
#edges .hit{pointer-events:stroke;stroke:transparent;stroke-width:18;fill:none;cursor:pointer}
#edges .wire{fill:none;stroke:#54685C;stroke-width:2.2}
#edges .wire.oneway{stroke-dasharray:9 5}
#edges .wire.shut{stroke:#7A4B45;stroke-dasharray:3 6}
#edges .wire.hl{stroke:var(--jade);stroke-width:3.4}
#edges .wire.sel{stroke:var(--ochre);stroke-width:3.4}

#hud{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;align-items:center;
  background:#141A17CC;border:1px solid var(--line);border-radius:var(--r);padding:5px 7px;backdrop-filter:blur(3px)}
#hud .z{color:var(--dim);min-width:42px;text-align:center;font-variant-numeric:tabular-nums}
#modeBar{position:absolute;left:50%;transform:translateX(-50%);top:12px;display:none;
  background:#20463AEE;border:1px solid var(--jade);border-radius:var(--r);padding:6px 12px;color:#CDF3E6}
#modeBar.on{display:block}

/* ---------- scene node ---------- */
.node{
  position:absolute;width:236px;background:linear-gradient(180deg,#20292400,#0000)
    ,var(--stone2);
  border:1px solid var(--line);border-left:4px solid var(--nc,#54685C);border-radius:var(--r);
  box-shadow:0 6px 18px #0007;user-select:none;
}
.node.sel{border-color:var(--ochre);box-shadow:0 0 0 1px var(--ochre),0 8px 22px #0009}
.node.dim{opacity:.35}
.node.hl{box-shadow:0 0 0 2px var(--jade),0 8px 22px #0009}
.node .head{padding:7px 9px 6px;cursor:grab;border-bottom:1px solid #ffffff10}
.node .head:active{cursor:grabbing}
.node .nm{font-family:var(--serif);font-size:14.5px;font-weight:600;line-height:1.25}
.node .dm{font-size:11px;color:var(--dim);margin-top:1px}
.node .body{padding:6px 9px 8px;display:flex;flex-direction:column;gap:5px}
.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 6px;border-radius:10px;
  border:1px solid #ffffff1c;background:#ffffff0c;white-space:nowrap;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;
}
.chip.dg{color:#F1B2AC;border-color:#6A322D;background:#3A1E1B}
.chip.tr{color:#F0CE96;border-color:#6A4C21;background:#3A2C15}
.chip.bk{color:#B7CBE6;border-color:#31455E;background:#1A2735}
.chip.god{color:#B7EFDA;border-color:#2E6B57;background:#173229;font-family:var(--serif)}
.chip.key{color:#E6DDF7;border-color:#4C3E70;background:#251E38}
.chip.done{opacity:.45;text-decoration:line-through}
.chip.clk{cursor:pointer}
.chip.clk:hover{filter:brightness(1.3)}
.ctr{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0006}
.ctr b{font-weight:600;font-size:11px;padding:1px 6px;color:var(--dim)}
.ctr .v{font-variant-numeric:tabular-nums;font-size:12px;padding:1px 5px;min-width:20px;text-align:center;color:var(--bone)}
.ctr button{background:#ffffff0d;border:0;color:var(--bone);width:19px;line-height:1;padding:2px 0;font-size:13px}
.ctr button:hover{background:var(--jade);color:#06110D}
.tokrow{display:flex;flex-wrap:wrap;gap:4px;padding-top:2px;border-top:1px dashed #ffffff14}
.tok{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px;border-radius:11px;
  border:1px solid var(--tc,#666);background:#0008;color:var(--tc,#ccc);cursor:grab;touch-action:none;
}
.tok:active{cursor:grabbing}
.tok .dot{width:7px;height:7px;border-radius:50%;background:var(--tc,#888)}
.tok.ghost{position:fixed;z-index:999;pointer-events:none;box-shadow:0 4px 14px #000a}
.node .foot{display:flex;gap:4px;padding:0 7px 7px}
.mini{background:#ffffff0d;border:1px solid #ffffff14;border-radius:4px;font-size:11px;padding:1px 6px;color:var(--dim)}
.mini:hover{background:var(--jade);color:#06110D;border-color:var(--jade)}
.elabel{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
  align-items:center;gap:3px;pointer-events:none;user-select:none}
.elabel>*{pointer-events:auto}
.elabel .elab{background:#141A17;cursor:pointer}
.erow{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}

/* ---------- inspector ---------- */
#insp{padding:0}
.ipad{padding:11px}
.ihead{position:sticky;top:0;background:linear-gradient(180deg,#1D2621,#18201C);
  border-bottom:1px solid var(--line);padding:9px 11px;z-index:4}
.ihead .t{font-family:var(--serif);font-size:15px;font-weight:600}
.ihead .s{font-size:11px;color:var(--dim)}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:8px 9px 10px;margin:0 0 10px}
legend{font-size:11.5px;color:var(--jade);padding:0 5px;letter-spacing:.3px}
label.f{display:block;margin-bottom:7px}
label.f>span{display:block;font-size:11px;color:var(--dim);margin-bottom:2px}
input[type=text],input[type=number],select,textarea{
  width:100%;background:#0E1412;border:1px solid var(--line);border-radius:4px;padding:4px 7px;
}
textarea{resize:vertical;min-height:46px}
input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);background:none;border-radius:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.item{border:1px solid var(--line);border-radius:5px;padding:7px;margin-bottom:7px;background:#ffffff06}
.item.dgi{border-left:3px solid var(--blood)}
.item.bki{border-left:3px solid var(--sky)}
.item.tri{border-left:3px solid var(--ochre)}
.item .ih{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.item .ih input[type=text]{flex:1}
.x{background:none;border:1px solid #5C302C;color:#E0958E;border-radius:4px;padding:1px 6px;font-size:12px}
.x:hover{background:#5C302C;color:#fff}
.lvl{display:flex;gap:3px}
.lvl button{width:20px;height:20px;border-radius:4px;border:1px solid var(--line);background:#0006;color:var(--dim);font-size:11px;padding:0}
.lvl button.on{background:var(--blood);border-color:var(--blood);color:#fff}
.tgl{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);cursor:pointer}
.linkbtn{background:none;border:0;color:var(--jade);text-decoration:underline;padding:0;font-size:12px;text-align:left}
.linkbtn:hover{color:#8FE3C6}
.empty{color:var(--dim);font-size:12px;font-style:italic;padding:3px 0}
ul.tight{margin:4px 0 0;padding-left:17px}
ul.tight li{margin-bottom:2px}

/* ---------- rail lists ---------- */
.card{border:1px solid var(--line);border-radius:5px;padding:7px 8px;margin-bottom:6px;background:#ffffff06}
.card .cn{font-family:var(--serif);font-size:13.5px;font-weight:600}
.card .cs{font-size:11.5px;color:var(--dim)}
.card.act{border-color:var(--jade);background:#54be9b14}
.srch{width:100%;margin-bottom:8px}
details.lib{border:1px solid var(--line);border-radius:5px;margin-bottom:5px;background:#ffffff06}
details.lib>summary{padding:6px 8px;cursor:pointer;font-size:12.5px;list-style:none}
details.lib>summary::-webkit-details-marker{display:none}
details.lib[open]>summary{border-bottom:1px solid var(--line);background:#ffffff08}
details.lib .lb{padding:7px 8px;font-size:12px;color:#CFD6CD}
.tagline{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:10.5px;padding:0 5px;border-radius:8px;border:1px solid #ffffff1a;color:var(--dim)}
.lv1{color:#8FE3C6}.lv2{color:#F0CE96}.lv3{color:#E9A9A2}.lv4{color:#F07E74}
.sep{height:1px;background:var(--line);margin:10px 0}
body.view .eonly{display:none!important}
body.view #top h1 span{color:var(--ochre)}
body.view #bMode{background:#4A3413;border-color:var(--ochre);color:#F5D9AE}
.rd{margin:0 0 11px}
.rd h4{font-family:var(--serif);font-size:13.5px;font-weight:600;margin:0 0 5px;
  color:var(--jade);border-bottom:1px solid var(--line);padding-bottom:3px}
.rd h4 span{float:right;color:var(--dim);font-family:var(--sans);font-size:11px;font-weight:400}
.rdi{border-left:3px solid var(--line);padding:2px 0 2px 8px;margin:0 0 8px}
.rdi.d{border-color:var(--blood)}.rdi.t{border-color:var(--ochre)}.rdi.b{border-color:var(--sky)}
.rdi.o{border-color:var(--jade)}
.rdi .n{font-weight:600}
.rdi .w{color:#CBD3C9;margin-top:1px}
.rdi .k{color:var(--dim);margin-top:2px}
.rdi .k b{color:#B5C4B8;font-weight:600}
.rdi.off{opacity:.45}
.jump{display:flex;flex-direction:column;gap:4px}
.jump button{display:flex;justify-content:space-between;gap:8px;align-items:baseline;text-align:left;
  background:#ffffff08;border:1px solid var(--line);border-radius:5px;padding:5px 8px;width:100%;min-width:0}
.jump .a{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jump .b{flex:0 0 auto;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.jump button:hover{background:#54be9b1f;border-color:var(--jade)}
.jump .a{font-family:var(--serif);font-size:13px}
.jump .b{font-size:11px;color:var(--dim);white-space:nowrap}
.card,.item,fieldset,.rd{min-width:0}
.card .cn,.card .cs{overflow-wrap:anywhere}
.rdi .w,.rdi .k{overflow-wrap:anywhere}
.chip.owe{color:#CFEAD9;border-color:#2E6B57;background:#12241D}
.chip.ev{color:#EFE1A6;border-color:#6A5C21;background:#312B12}
.chip.loc{color:#C7D6E0;border-color:#3B4C57;background:#18242A}
.item.loi{border-left:3px solid #6E8794}
.lnks{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.lnk{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;padding:1px 7px;border-radius:10px;
  border:1px solid #3B5566;background:#132029;color:#9FC9E0;text-decoration:none}
.lnk:hover{background:#1C2F3C;color:#CFE7F5;border-color:#54809B}
.rdi.l{border-color:#6E8794}
.item.evi{border-left:3px solid #C9B458}
.rdi.e{border-color:#C9B458}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#20463A;
  border:1px solid var(--jade);color:#D9F6EC;padding:8px 16px;border-radius:var(--r);z-index:900;
  box-shadow:0 8px 24px #000a}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}
@media(max-width:1100px){#main{--railW:230px;--inspW:290px}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <h1>Гробниця <span>Дев'яти Богів</span> · дошка сцен</h1>
    <button class="btn eonly" id="bAddScene">+ Сцена</button>
    <button class="btn eonly" id="bLink">🔗 З'єднати</button>
    <button class="btn" id="bFit">Вмістити все</button>
    <button class="btn" id="bMode">👁 Режим перегляду</button>
    <div class="spacer"></div>
    <button class="btn" id="bImport">Імпорт JSON</button>
    <button class="btn acc" id="bExport">Експорт JSON</button>
    <button class="btn eonly" id="bDemo">Демо-розкладка</button>
    <button class="btn warn eonly" id="bClear">Очистити</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </header>

  <div id="main">
    <aside id="rail">
      <nav id="tabs"></nav>
      <div id="panes">
        <section class="pane on" id="p-scenes"></section>
        <section class="pane" id="p-tokens"></section>
      </div>
    </aside>

    <div class="gut" id="gutL" title="Тягніть, щоб змінити ширину. Подвійний клік — згорнути"></div>

    <div id="boardWrap">
      <canvas id="grid"></canvas>
      <div id="world">
        <svg id="edges"></svg>
      </div>
      <div id="modeBar" class="on">Оберіть сцену-джерело, потім сцену-ціль. Esc — скасувати.</div>
      <div id="hud">
        <button class="btn sm" id="zOut">−</button>
        <span class="z" id="zLbl">100%</span>
        <button class="btn sm" id="zIn">+</button>
        <button class="btn sm" id="zRst">1:1</button>
      </div>
    </div>

    <div class="gut" id="gutR" title="Тягніть, щоб змінити ширину. Подвійний клік — згорнути"></div>

    <aside id="insp"></aside>
  </div>
</div>
<script>
"use strict";
/* ============================================================
   ДОШКА СЦЕН — Tomb of Annihilation / епік на кілька столів
   Один файл. Дані живуть у пам'яті; збереження — Експорт JSON.
   ============================================================ */

const GODS = [
  {id:'obolaka', nm:"Обо'лака",  form:'зорбо'},
  {id:'moa',     nm:'Моа',       form:'якулі'},
  {id:'wongo',   nm:'Вонґо',     form:'су-монстр'},
  {id:'papazotl',nm:'Папазотль', form:'ебліс'},
  {id:'nangnang',nm:'Нанґнанґ',  form:'ґрунґ'},
  {id:'ijin',    nm:"І'джин",    form:'альміраж'},
  {id:'kubazan', nm:'Кубазан',   form:'фрогемот'},
  {id:'shagambi',nm:'Шаґамбі',   form:'камадан'},
  {id:'unkh',    nm:'Ункх',      form:'flail snail'},
];
const GOD_BY = Object.fromEntries(GODS.map(g => [g.id, g]));

const KEYS = [
  {id:'k3', nm:'Трикутник',   sym:'▲'},
  {id:'k4', nm:'Квадрат',     sym:'■'},
  {id:'k5', nm:"П'ятикутник", sym:'⬟'},
  {id:'k6', nm:'Шестикутник', sym:'⬢'},
  {id:'k8', nm:'Восьмикутник',sym:'⯃'},
];
const KEY_BY = Object.fromEntries(KEYS.map(k => [k.id, k]));

/* Стандартні списки локацій. Далі ДМ може додати свої. */
function defaultRegs(){
  return [
    {id:'gods', nm:'Гробниці богів', one:'Гробниця', sym:'⛩', color:'#54BE9B',
     items:GODS.map(g => ({id:g.id, nm:g.nm, sym:'', note:g.form}))},
    {id:'keys', nm:'Скелетні ключі', one:'Ключ', sym:'🔑', color:'#9B7BC4',
     items:KEYS.map(k => ({id:k.id, nm:k.nm, sym:k.sym, note:''}))},
  ];
}

/* Заготовки з нотаток епіку */
const TPL_DANGER = [
  {nm:'Орди нежиті', what:'Сцена постійно заповнюється новими хвилями нежиті. Знищення окремих істот не вирішує проблему.', fix:'Некроманти в іншій сцені підтримують орди. Якщо їх убити, нова нежить перестає з\'являтися.', lvl:3},
  {nm:'Токсичний слиз', what:'Слиз і токсичні випари роблять перебування та пересування сценою небезпечними.', fix:'В алхімічній лабораторії є вентиль, який перекриває подачу слизу.', lvl:2},
  {nm:'Надто гаряча зона', what:'Температура настільки висока, що довге перебування стає небезпечним.', fix:'Древня кузня в іншій сцені. Якщо загасити — температура поступово падає.', lvl:2},
  {nm:'Привиди дослідників', what:'5 Ghosts переслідують групу підземеллям. Навіть після втечі чи перемоги вони повертаються.', fix:'Знайти й поховати тіла п\'ятьох загиблих дослідників в іншій сцені.', lvl:3},
];
const TPL_BLOCK = [

/* ---------- state ---------- */
let S = blank();
let sel = null;              // {kind:'scene'|'conn'|'token', id}
let linkMode = null;         // null | {from:null|id}
let mode = 'edit';           // 'edit' | 'view'
let dirty = false;
const cam = {x:0, y:0, z:1};

function blank(){
  return {app:'toa-scene-board', version:3, title:'Друга фаза — дослідження підземелля',
          scenes:[], connections:[], tokens:[], registries:defaultRegs(), seq:1};
}
function uid(p){ return p + (S.seq++) + Math.random().toString(36).slice(2,5); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function byId(a,id){ return a.find(x => x.id === id) || null; }
function scene(id){ return byId(S.scenes,id); }
function conn(id){ return byId(S.connections,id); }
function token(id){ return byId(S.tokens,id); }
function mark(){ dirty = true; }
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg;
  document.body.appendChild(d); setTimeout(() => d.remove(), 2200);
}

const NODE_W = 236;
function nodeEl(id){ return document.querySelector(`.node[data-scene="${id}"]`); }
const HCACHE = new Map();          // висоти карток — щоб не смикати layout під час перетягування
const EDGE = new Map();            // conn.id -> {line, hit, label}
function measureNodes(){
  HCACHE.clear();
  world.querySelectorAll('.node').forEach(e => HCACHE.set(e.dataset.scene, e.offsetHeight));
}
function nodeSize(id){
  let hgt = HCACHE.get(id);
  if (hgt == null){ const e = nodeEl(id); hgt = e ? e.offsetHeight : 110; if (e) HCACHE.set(id, hgt); }
  return {w:NODE_W, h:hgt};
}

/* ============================================================
   Створення сутностей
   ============================================================ */
function newScene(x, y, patch){
  const n = S.scenes.length;
  const s = {id:uid('s'), name:'Нова сцена ' + (n+1), dm:'', color:SCENE_COLORS[n % SCENE_COLORS.length],
    x:x|0, y:y|0, notes:'', dangers:[], blocks:[], events:[], locations:[], counters:[]};
  Object.assign(s, patch||{});
  S.scenes.push(s); mark(); return s;
}
function newConn(from, to){
  if (from === to) return null;
  const dup = S.connections.filter(c => (c.from===from&&c.to===to)||(c.from===to&&c.to===from)).length;
  const c = {id:uid('c'), from, to, name: dup ? 'З\'єднання ' + (dup+1) : 'З\'єднання',
             dir:'two', fromSide:'', toSide:'', desc:'', minutes:1, open:true, counters:[]};
  if (dup) toast('Ще одне з\'єднання між тими самими сценами — вкажіть боки, щоб їх розвести');
  S.connections.push(c); mark(); return c;
}
function delScene(id){
  S.scenes = S.scenes.filter(s => s.id !== id);
  S.connections = S.connections.filter(c => c.from !== id && c.to !== id);
  S.tokens.forEach(t => { if (t.at && t.at.id === id) t.at = null; });
  if (sel && sel.id === id) sel = null;
  mark(); renderAll();
}
function delConn(id){
  S.connections = S.connections.filter(c => c.id !== id);
  S.tokens.forEach(t => { if (t.at && t.at.id === id) t.at = null; });
  if (sel && sel.id === id) sel = null;
  mark(); renderAll();
}

/* ============================================================
   Камера / сітка
   ============================================================ */
const wrap = document.getElementById('boardWrap');
const world = document.getElementById('world');
const svg = document.getElementById('edges');
const gridC = document.getElementById('grid');

let gridRaf = 0;
function applyCam(){
  world.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;
  document.getElementById('zLbl').textContent = Math.round(cam.z*100) + '%';
  if (!gridRaf) gridRaf = requestAnimationFrame(() => { gridRaf = 0; drawGrid(); });
}
function drawGrid(){
  const r = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  gridC.width = r.width*dpr; gridC.height = r.height*dpr;
  gridC.style.width = r.width+'px'; gridC.style.height = r.height+'px';
  const g = gridC.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,r.width,r.height);
  const step = 48*cam.z; if (step < 9) return;
  g.strokeStyle = '#FFFFFF08'; g.lineWidth = 1;
  const ox = cam.x % step, oy = cam.y % step;
  g.beginPath();
  for (let x = ox; x < r.width; x += step){ g.moveTo(x+.5,0); g.lineTo(x+.5,r.height); }
  for (let y = oy; y < r.height; y += step){ g.moveTo(0,y+.5); g.lineTo(r.width,y+.5); }
  g.stroke();
}
function screenToWorld(cx, cy){
  const r = wrap.getBoundingClientRect();
  return {x:(cx - r.left - cam.x)/cam.z, y:(cy - r.top - cam.y)/cam.z};
}
function centerOn(x, y, z){
  const r = wrap.getBoundingClientRect();
  if (z) cam.z = z;
  cam.x = r.width/2 - x*cam.z; cam.y = r.height/2 - y*cam.z;
  applyCam();
}
function focusScene(id){
  const s = scene(id); if (!s) return;
  const sz = nodeSize(id);
  centerOn(s.x + sz.w/2, s.y + sz.h/2, Math.max(cam.z, .85));
  select('scene', id);
  const e = nodeEl(id);
  if (e){ e.classList.add('hl'); setTimeout(() => e.classList.remove('hl'), 1400); }
}
function fitAll(){
  if (!S.scenes.length){ cam.x = 40; cam.y = 40; cam.z = 1; applyCam(); return; }
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  S.scenes.forEach(s => { const h = nodeSize(s.id).h;
    x0=Math.min(x0,s.x); y0=Math.min(y0,s.y); x1=Math.max(x1,s.x+NODE_W); y1=Math.max(y1,s.y+h); });
  const r = wrap.getBoundingClientRect(), pad = 70;
  cam.z = Math.min(1.2, Math.max(.25, Math.min((r.width-pad*2)/(x1-x0||1), (r.height-pad*2)/(y1-y0||1))));
  centerOn((x0+x1)/2, (y0+y1)/2);
}

/* ============================================================
   Рендер дошки
   ============================================================ */
function dangerColor(l){ return ['#54685C','#C9B458','#D08A34','#C0524A','#E2564A'][Math.min(4,l||1)]; }

function renderBoard(){
  [...world.querySelectorAll('.node')].forEach(n => n.remove());
  const frag = document.createDocumentFragment();
  const neigh = sel && sel.kind === 'scene' ? neighborsOf(sel.id) : null;

  S.scenes.forEach(s => {
    const d = document.createElement('div');
    d.className = 'node';
    d.dataset.scene = s.id;
    d.style.setProperty('--nc', s.color || '#54685C');
    d.style.left = s.x + 'px'; d.style.top = s.y + 'px';
    if (sel && sel.kind === 'scene' && sel.id === s.id) d.classList.add('sel');
    if (neigh && !neigh.has(s.id) && sel.id !== s.id) d.classList.add('dim');

    const actD = s.dangers.filter(x => x.active !== false);
    const openB = s.blocks.filter(x => !x.done);
    const tres = locs(s).filter(isTre), leftT = tres.filter(x => !x.taken);
    const maxL = actD.reduce((m,x) => Math.max(m, x.lvl||1), 0);
    const toks = S.tokens.filter(t => t.at && t.at.kind === 'scene' && t.at.id === s.id);

    let h = `<div class="head"><div class="nm">${esc(s.name)}</div>`;
    h += `<div class="dm">${s.dm ? 'ДМ: ' + esc(s.dm) : 'ДМ не вказано'}</div></div><div class="body">`;

    h += `<div class="row">`;
    h += `<span class="chip dg" title="Активні небезпеки" style="${maxL?`border-color:${dangerColor(maxL)};color:${dangerColor(maxL)}`:''}">☠ ${actD.length}</span>`;
    h += `<span class="chip tr" title="Не забрані скарби">◈ ${leftT.length}/${tres.length}</span>`;
    h += `<span class="chip bk" title="Нерозв'язані блоки">⛔ ${openB.length}/${s.blocks.length}</span>`;
    const ev = (s.events||[]).filter(e => !e.fired);
    if (ev.length) h += `<span class="chip ev" title="Івенти, які ще не спрацювали: ${
      esc(ev.map(e => e.nm).join('; '))}">⚡ ${ev.length}</span>`;
    const owe = owedBy(s.id);
    if (owe.length) h += `<span class="chip owe" title="Тут лежать рішення для інших сцен: ${
      esc(owe.map(o => o.from.name + ' → ' + o.it.nm).join('; '))}">↩ ${owe.length}</span>`;
    h += `</div>`;

    if (locs(s).length){
      h += `<div class="row">`;
      locs(s).forEach(l => {
        const col = locColor(l);
        h += `<span class="chip" style="color:${col};border-color:${col}55;background:${col}14"
          title="${esc(l.notes || 'кімната')}">${locIcon(l)} ${esc(locName(l))}</span>`;
      });
      h += `</div>`;
    }
    if (s.counters.length){
      h += `<div class="row">`;
      s.counters.forEach(c => {
        h += `<span class="ctr"><b>${esc(c.label)}</b><button data-ctr="s:${s.id}:${c.id}:-1">−</button>`
          +  `<span class="v">${c.value}</span><button data-ctr="s:${s.id}:${c.id}:1">+</button></span>`;
      });
      h += `</div>`;
    }
    if (toks.length){
      h += `<div class="tokrow">`;
      toks.forEach(t => { const c = t.color || (TOKTYPE[t.type]||TOKTYPE.other).c;
        h += `<span class="tok" data-token="${t.id}" style="--tc:${c}"><i class="dot"></i>${esc(t.name)}${t.hp!=null&&t.hp!==''?' · '+esc(t.hp):''}</span>`; });
      h += `</div>`;
    }
    h += `</div><div class="foot"><button class="mini eonly" data-act="link" data-id="${s.id}">з'єднати</button>`
      +  `<button class="mini" data-act="open" data-id="${s.id}">деталі</button></div>`;
    d.innerHTML = h;
    frag.appendChild(d);
  });
  world.appendChild(frag);
  measureNodes();
  drawEdges();
}

/* ============================================================
   Локація — кімната сцени: назва та опис. У кімнаті може лежати
   скарб і будь-який елемент зі списків (гробниці богів, скелетні
   ключі та інші, які ДМ створює сам).
   ============================================================ */
function locs(s){ return s.locations || (s.locations = []); }
function isTre(l){ return !!l.hasTre; }

function regs(){ return S.registries || (S.registries = defaultRegs()); }
function reg(id){ return byId(regs(), id); }
function slots(l){ return l.reg || (l.reg = {}); }
function slotList(l){
  const out = [];
  regs().forEach(r => { const iid = slots(l)[r.id]; if (!iid) return;
    const it = byId(r.items, iid); if (it) out.push({r, it}); });
  return out;
}
function itemsIn(s, rid){ return locs(s).map(l => slots(l)[rid]).filter(Boolean); }
function hostOf(rid, iid){ return S.scenes.find(s => locs(s).some(l => slots(l)[rid] === iid)) || null; }
function mkLoc(patch){
  return Object.assign({id:uid('l'), nm:'', notes:'', reg:{}, hasTre:false, tre:'', guard:'',
                        taken:false, links:[]}, patch || {});
}
function locEmpty(l){
  return !l.nm && !l.notes && !l.hasTre && !(l.links || []).length
      && !Object.values(l.reg || {}).some(Boolean);
}
function clearSlot(rid, iid, keepLocId){
  S.scenes.forEach(s => {
    locs(s).forEach(l => { if (slots(l)[rid] === iid && l.id !== keepLocId) delete l.reg[rid]; });
    s.locations = locs(s).filter(l => !locEmpty(l));
  });
}
function place(rid, iid, sid){
  clearSlot(rid, iid);
  if (sid && scene(sid)) locs(scene(sid)).push(mkLoc({reg:{[rid]:iid}}));
  mark();
}
function locName(l){
  if (l.nm) return l.nm;
  const sl = slotList(l);
  if (sl.length) return ((sl[0].r.one || sl[0].r.nm) + ' ' + sl[0].it.nm).trim();
  if (l.hasTre) return 'Кімната зі скарбом';
  return 'Кімната';
}
function locIcon(l){
  let s = slotList(l).map(x => x.it.sym || x.r.sym || '◆').join('');
  if (l.hasTre) s += '◈';
  return s || '▣';
}
function locColor(l){
  const sl = slotList(l);
  if (sl.length) return sl[0].r.color || '#C7D6E0';
  return l.hasTre ? '#F0CE96' : '#C7D6E0';
}
function locLinks(l){ return l.links || (l.links = []); }
function safeUrl(u){
  u = String(u||'').trim();
  if (!u) return '';
  if (/^(https?:|mailto:)/i.test(u)) return u;
  if (/^javascript:/i.test(u)) return '';
  return 'https://' + u;
}
function linkLabel(k){
  if (k.label) return k.label;
  try { return new URL(safeUrl(k.url)).hostname.replace(/^www\./,''); } catch(e){ return k.url || 'посилання'; }
}
function renderLinks(l){
  const ls = locLinks(l).filter(k => k.url);
  if (!ls.length) return '';
  return `<div class="lnks">${ls.map(k =>
    `<a class="lnk" href="${esc(safeUrl(k.url))}" target="_blank" rel="noopener noreferrer">🔗 ${esc(linkLabel(k))}</a>`).join('')}</div>`;
}

/* Ціль блоку завжди всередині своєї ж сцени */
const BLOCK_KINDS = [
  ['loc',   'локацію в цій сцені'],
  ['conn',  'прохід із цієї сцени'],
  ['other', 'щось інше (текстом)'],
];
function blockTargets(s, kind){
  if (kind === 'conn') return S.connections.filter(c => c.from === s.id || c.to === s.id)
    .map(c => { const o = scene(c.from === s.id ? c.to : c.from);
                return {v:c.id, l:c.name + ' → ' + (o ? o.name : '?')}; });
  if (kind === 'loc') return locs(s).map(l => ({v:l.id, l:locIcon(l) + ' ' + locName(l)}));
  return [];
}
function blockTargetLabel(s, b){
  if (!b.tgtKind || b.tgtKind === 'other') return b.tgtText || '';
  const o = blockTargets(s, b.tgtKind).find(x => x.v === b.tgt);
  return o ? o.l : '';
}
function blockOnLoc(s, lid){ return s.blocks.find(b => b.tgtKind === 'loc' && b.tgt === lid) || null; }
function blockOnConn(cid){
  for (const s of S.scenes){ const b = s.blocks.find(x => x.tgtKind === 'conn' && x.tgt === cid); if (b) return {s, b}; }
  return null;
}

/* Що інші сцени очікують отримати саме тут: рішення небезпек і ключі до блоків */
function owedBy(sceneId){
  const out = [];
  S.scenes.forEach(s => {
    if (s.id === sceneId) return;
    s.dangers.forEach(d => { if (d.src === sceneId) out.push({from:s, kind:'danger', it:d}); });
    s.blocks.forEach(b => { if (b.src === sceneId) out.push({from:s, kind:'block', it:b}); });
  });
  return out;
}

function neighborsOf(id){
  const set = new Set([id]);
  S.connections.forEach(c => { if (c.from === id) set.add(c.to); if (c.to === id) set.add(c.from); });
  return set;
}

function anchor(id){
  const s = scene(id); if (!s) return null;
  const sz = nodeSize(id);
  return {x:s.x + sz.w/2, y:s.y + sz.h/2, w:sz.w, h:sz.h};
}
const SIDES = [['','авто'],['N','північ'],['NE','пн-схід'],['E','схід'],['SE','пд-схід'],
  ['S','південь'],['SW','пд-захід'],['W','захід'],['NW','пн-захід'],['up','вгору'],['down','вниз']];
const SIDE_VEC = {N:[0,-1], NE:[.75,-.75], E:[1,0], SE:[.75,.75],
                  S:[0,1], SW:[-.75,.75], W:[-1,0], NW:[-.75,-.75]};
const SIDE_SYM = {N:'↑', NE:'↗', E:'→', SE:'↘', S:'↓', SW:'↙', W:'←', NW:'↖', up:'⇑', down:'⇓'};
function sideMark(c){
  const a = SIDE_SYM[c.fromSide] || '', b = SIDE_SYM[c.toSide] || '';
  return (a || b) ? ` <span style="opacity:.7">${a}${a&&b?'·':''}${b}</span>` : '';
}
function sideLabel(v){ const s = SIDES.find(x => x[0] === v); return s ? s[1] : ''; }
function edgeAt(a, u){
  const hw = a.w/2 + 4, hh = a.h/2 + 4;
  const sx = u[0] ? hw/Math.abs(u[0]) : Infinity, sy = u[1] ? hh/Math.abs(u[1]) : Infinity;
  const t = Math.min(sx, sy);
  return {x:a.x + u[0]*t, y:a.y + u[1]*t};
}
function edgePoint(a, b){
  // точка на межі прямокутника a у напрямку b
  const dx = b.x - a.x, dy = b.y - a.y;
  if (!dx && !dy) return {x:a.x, y:a.y};
  const hw = a.w/2 + 4, hh = a.h/2 + 4;
  const sx = dx ? hw/Math.abs(dx) : Infinity, sy = dy ? hh/Math.abs(dy) : Infinity;
  const t = Math.min(sx, sy);
  return {x:a.x + dx*t, y:a.y + dy*t};
}
function siblings(c){
  return S.connections.filter(x => (x.from===c.from && x.to===c.to) || (x.from===c.to && x.to===c.from));
}
function connMid(c){
  const A = anchor(c.from), B = anchor(c.to); if (!A||!B) return null;
  let p = SIDE_VEC[c.fromSide] ? edgeAt(A, SIDE_VEC[c.fromSide]) : edgePoint(A, B);
  let q = SIDE_VEC[c.toSide]   ? edgeAt(B, SIDE_VEC[c.toSide])   : edgePoint(B, A);
  const sibs = siblings(c);
  if (sibs.length > 1){
    const i = sibs.findIndex(x => x.id === c.id);
    const off = (i - (sibs.length - 1)/2) * 20;
    const dx = q.x - p.x, dy = q.y - p.y, L = Math.hypot(dx, dy) || 1;
    const nx = -dy/L*off, ny = dx/L*off;
    if (!SIDE_VEC[c.fromSide]){ p = {x:p.x + nx, y:p.y + ny}; }
    if (!SIDE_VEC[c.toSide]){ q = {x:q.x + nx, y:q.y + ny}; }
  }
  return {x:(p.x+q.x)/2, y:(p.y+q.y)/2, p, q};
}

function drawEdges(){
  EDGE.clear();
  svg.innerHTML = `<defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#54685C"/></marker>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#54BE9B"/></marker>
  </defs>`;
  const NS = 'http://www.w3.org/2000/svg';
  const hlSet = sel && sel.kind === 'scene' ? sel.id : null;

  S.connections.forEach(c => {
    const m = connMid(c); if (!m) return;
    const hl = hlSet && (c.from === hlSet || c.to === hlSet);
    const isSel = sel && sel.kind === 'conn' && sel.id === c.id;

    const l = document.createElementNS(NS,'line');
    l.setAttribute('x1',m.p.x); l.setAttribute('y1',m.p.y);
    l.setAttribute('x2',m.q.x); l.setAttribute('y2',m.q.y);
    EDGE.set(c.id, {line:l, hit:null, label:null});
    l.setAttribute('class','wire' + (c.dir==='one'?' oneway':'') + (c.open===false?' shut':'') + (hl?' hl':'') + (isSel?' sel':''));
    if (c.dir === 'one') l.setAttribute('marker-end', hl ? 'url(#arh)' : 'url(#ar)');
    svg.appendChild(l);

    const hit = document.createElementNS(NS,'line');
    hit.setAttribute('x1',m.p.x); hit.setAttribute('y1',m.p.y);
    hit.setAttribute('x2',m.q.x); hit.setAttribute('y2',m.q.y);
    hit.setAttribute('class','hit'); hit.dataset.conn = c.id;
    svg.appendChild(hit);
    EDGE.get(c.id).hit = hit;

  });
  renderEdgeLabels();
}

function renderEdgeLabels(){
  [...world.querySelectorAll('.elabel')].forEach(n => n.remove());
  const frag = document.createDocumentFragment();
  S.connections.forEach(c => {
    const m = connMid(c); if (!m) return;
    const isSel = sel && sel.kind === 'conn' && sel.id === c.id;
    const toks = S.tokens.filter(t => t.at && t.at.kind === 'conn' && t.at.id === c.id);
    const d = document.createElement('div');
    d.className = 'elabel';
    d.style.left = m.x + 'px'; d.style.top = m.y + 'px';
    let inner = `<span class="chip clk elab" data-conn="${c.id}" style="border-color:${isSel?'#D08A34':'#3A4941'}">`
      + `${c.open===false?'✕ ':''}${esc(c.name)}${sideMark(c)}${c.dir==='one'?' →':' ↔'}${c.minutes?` · ${esc(c.minutes)}хв`:''}</span>`;
    if (c.counters.length){
      inner += `<span class="erow">`;
      c.counters.forEach(k => { inner += `<span class="ctr"><b>${esc(k.label)}</b>`
        + `<button data-ctr="c:${c.id}:${k.id}:-1">−</button><span class="v">${k.value}</span>`
        + `<button data-ctr="c:${c.id}:${k.id}:1">+</button></span>`; });
      inner += `</span>`;
    }
    if (toks.length){
      inner += `<span class="erow">`;
      toks.forEach(t => { const col = t.color || (TOKTYPE[t.type]||TOKTYPE.other).c;
        inner += `<span class="tok" data-token="${t.id}" style="--tc:${col}"><i class="dot"></i>${esc(t.name)}</span>`; });
      inner += `</span>`;
    }
    d.innerHTML = inner;
    frag.appendChild(d);
    const reg = EDGE.get(c.id); if (reg) reg.label = d;
  });
  world.appendChild(frag);
}

/* Пересунути тільки ті ребра, що торкаються сцени — без перебудови DOM */
function moveEdgesOf(sid){
  S.connections.forEach(c => {
    if (c.from !== sid && c.to !== sid) return;
    const reg = EDGE.get(c.id); if (!reg) return;
    const m = connMid(c); if (!m) return;
    [reg.line, reg.hit].forEach(el => {
      if (!el) return;
      el.setAttribute('x1', m.p.x); el.setAttribute('y1', m.p.y);
      el.setAttribute('x2', m.q.x); el.setAttribute('y2', m.q.y);
    });
    if (reg.label){ reg.label.style.left = m.x + 'px'; reg.label.style.top = m.y + 'px'; }
  });
}

<script>
"use strict";
/* ============================================================
   Універсальний доступ до полів за шляхом
   ============================================================ */
function resolve(path){
  const p = path.split(':');
  let obj = null;
  if (p[0] === 's') obj = scene(p[1]);
  else if (p[0] === 'c') obj = conn(p[1]);
  else if (p[0] === 't') obj = token(p[1]);
  else if (p[0] === 'r') obj = reg(p[1]);
  if (!obj) return null;
  if (p.length === 3) return {obj, key:p[2]};
  if (p.length === 5){ const it = byId(obj[p[2]]||[], p[3]); return it ? {obj:it, key:p[4]} : null; }
  if (p.length === 7){
    const it = byId(obj[p[2]]||[], p[3]); if (!it) return null;
    const sub = byId(it[p[4]]||[], p[5]); return sub ? {obj:sub, key:p[6]} : null;
  }
  return null;
}
function setPath(path, val){
  const r = resolve(path); if (!r) return;
  r.obj[r.key] = val; mark();
}

/* ============================================================
   Інспектор

    else insp.innerHTML = inspToken(token(sel.id));
    if (!insp.innerHTML) insp.innerHTML = inspEmpty();
    return;
  }
