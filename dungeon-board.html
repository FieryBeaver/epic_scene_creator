        style="color:${r.color||'#C7D6E0'};border-color:${(r.color||'#888')}55"
        title="${esc(it.note||'')}${host?' · зараз у «'+esc(host.name)+'»':''}">${
        it.sym||r.sym||'◆'} ${esc(it.nm)}</button>`; });
    h += `</div>`;
  });
  h += `</fieldset>`;

  /* лічильники */  h += `</div></fieldset>`;

  /* лічильники */
  h += `<fieldset><legend>Лічильники</legend>`;
  if (!s.counters.length) h += `<div class="empty">Немає лічильників</div>`;
  s.counters.forEach(c => {
    h += `<div class="ih"><input type="text" data-path="s:${s.id}:counters:${c.id}:label" value="${esc(c.label)}">
      <input type="number" style="width:70px" data-path="s:${s.id}:counters:${c.id}:value" data-num="1" value="${c.value}">
      <button class="x" data-del="s:${s.id}:counters:${c.id}">✕</button></div>`;
  });
  h += `<button class="btn sm" data-add="counter" data-id="${s.id}">+ лічильник</button>
        <span class="hint" style="display:block;margin-top:5px">Хвилі, раунди, HP союзників, спрацювання пасток…</span></fieldset>`;

  /* з'єднання */
  h += `<fieldset><legend>З'єднання · ${conns.length}</legend>`;
  if (!conns.length) h += `<div class="empty">Немає з'єднань</div>`;
  conns.forEach(c => {
    const other = c.from === s.id ? c.to : c.from;
    const os = scene(other);
    const arrow = c.dir === 'one' ? (c.from === s.id ? '→' : '←') : '↔';
    const mySide = c.from === s.id ? c.fromSide : c.toSide;
    h += `<div class="row" style="justify-content:space-between;margin-bottom:4px">
      <button class="linkbtn" data-goto="${other}">${mySide?(SIDE_SYM[mySide]||'')+' ':''}${arrow} ${os?esc(os.name):'?'}</button>
      <span><button class="btn sm" data-selconn="${c.id}">${esc(c.name)}</button></span></div>`;
  });
  h += `<button class="btn sm" data-act="link" data-id="${s.id}">+ з'єднати з іншою сценою</button></fieldset>`;

  /* токени */
  h += `<fieldset><legend>Токени у сцені · ${toks.length}</legend>`;
  if (!toks.length) h += `<div class="empty">Порожньо</div>`;
  toks.forEach(t => h += `<div class="row" style="justify-content:space-between;margin-bottom:3px">
      <button class="linkbtn" data-seltoken="${t.id}">${esc(t.name)}</button>
      <span class="tag">${esc((TOKTYPE[t.type]||TOKTYPE.other).nm)}</span></div>`);
  h += `<button class="btn sm" data-add="token" data-id="${s.id}">+ токен сюди</button></fieldset>`;

  /* івенти */
  h += `<fieldset><legend>Івенти · ${s.events.length}</legend>`;
  if (!s.events.length) h += `<div class="empty">Немає. Івент — подія, яку запускають самі гравці: обвал, прорив води, пробудження механізму.</div>`;
  s.events.forEach(e => {
    const conns = S.connections.filter(c => c.from === s.id || c.to === s.id);
    h += `<div class="item evi">
      <div class="ih"><input type="text" data-path="s:${s.id}:events:${e.id}:nm" value="${esc(e.nm)}">
        <button class="x" data-del="s:${s.id}:events:${e.id}">✕</button></div>
      <label class="f"><span>Тригер — що мають зробити гравці</span><textarea data-path="s:${s.id}:events:${e.id}:trig">${esc(e.trig)}</textarea></label>
      <label class="f"><span>Що стається</span><textarea data-path="s:${s.id}:events:${e.id}:eff">${esc(e.eff)}</textarea></label>
      <div class="grid2">
        <label class="f"><span>Впливає на перехід</span>
          <select data-path="s:${s.id}:events:${e.id}:conn">
            <option value="">— жоден —</option>
            ${conns.map(c => { const o = scene(c.from === s.id ? c.to : c.from);
              return `<option value="${c.id}"${e.conn===c.id?' selected':''}>${esc(c.name)} → ${esc(o?o.name:'?')}</option>`; }).join('')}
          </select></label>
        <label class="f"><span>Дія</span>
          <select data-path="s:${s.id}:events:${e.id}:act">
            <option value="open"${e.act==='open'?' selected':''}>відкриває</option>
            <option value="close"${e.act==='close'?' selected':''}>закриває</option>
          </select></label>
      </div>
      <label class="tgl"><input type="checkbox" data-fire="${s.id}:${e.id}" ${e.fired?'checked':''}> спрацював</label>
    </div>`;
  });
  h += `<div class="row"><button class="btn sm" data-add="event" data-id="${s.id}">+ івент</button>
        <select class="btn sm" data-tpl="event" data-id="${s.id}" style="width:auto">
        <option value="">з заготовки…</option>${TPL_EVENT.map((t,i)=>`<option value="${i}">${esc(t.nm)}</option>`).join('')}</select></div>`;
  h += `</fieldset>`;

  /* що ця сцена дає іншим */
  const owe = owedBy(s.id);
  h += `<fieldset><legend>Ця сцена розв'язує · ${owe.length}</legend>`;
  if (!owe.length) h += `<div class="empty">Ніхто не чекає рішення звідси. Щоб з'явилось — у чужій небезпеці чи блоці вкажіть цю сцену.</div>`;
  owe.forEach(o => {
    h += `<div class="item ${o.kind==='danger'?'dgi':'bki'}">
      <div class="ih"><b>${o.kind==='danger'?'☠':'⛔'} ${esc(o.it.nm)}</b></div>
      <div style="font-size:12px;color:#CBD3C9">${esc(o.kind==='danger'?o.it.fix:o.it.key)}</div>
      ${owedLoc(s, o.it) ? `<div style="font-size:12px;color:var(--jade);margin-top:3px">тут: ${owedLoc(s, o.it)}</div>` : ''}
      <div style="margin-top:4px">для <button class="linkbtn" data-goto="${o.from.id}">${esc(o.from.name)}</button>
        ${o.kind==='danger' ? (o.it.active===false?'<span class="tag">вже вимкнено</span>':'') :
                              (o.it.done?'<span class="tag">вже вирішено</span>':'')}</div>
    </div>`;
  });
  h += `</fieldset>`;

  h += `</div>`;
  return h;
}

/* ============================================================
   Режим перегляду — нічого не редагується, зручно стрибати
   ============================================================ */
function lvlDots(n){ n = n||1; return '●'.repeat(n) + '<span style="opacity:.3">' + '●'.repeat(4-n) + '</span>'; }

function ctrRow(host, w){
  if (!host.counters.length) return '';
  return `<div class="row" style="margin-top:4px">` + host.counters.map(c =>
    `<span class="ctr"><b>${esc(c.label)}</b><button data-ctr="${w}:${host.id}:${c.id}:-1">−</button>`
    + `<span class="v">${c.value}</span><button data-ctr="${w}:${host.id}:${c.id}:1">+</button></span>`).join('') + `</div>`;
}

function readScene(s){
  if (!s) return '';
  const conns = S.connections.filter(c => c.from === s.id || c.to === s.id);
  const owe = owedBy(s.id);
  const toks = S.tokens.filter(t => t.at && t.at.kind === 'scene' && t.at.id === s.id);
  let h = `<div class="ihead"><div class="t">${esc(s.name)}</div>
    <div class="s">${s.dm ? 'ДМ ' + esc(s.dm) : 'ДМ не вказано'}${
      regs().map(r => { const ids = itemsIn(s, r.id); return ids.length
        ? ' · ' + ids.map(i => esc((byId(r.items, i)||{}).nm || i)).join(', ') : ''; }).join('')}</div></div>
    <div class="ipad">`;

  if (s.notes) h += `<div class="rd" style="color:#CBD3C9;white-space:pre-wrap">${esc(s.notes)}</div>`;

  h += `<div class="rd"><h4>Переходи <span>${conns.length}</span></h4>`;
  if (!conns.length) h += `<div class="empty">Сцена ізольована</div>`;
  h += `<div class="jump">`;
  conns.forEach(c => {
    const other = c.from === s.id ? c.to : c.from, os = scene(other);
    const arrow = c.dir === 'one' ? (c.from === s.id ? '→' : '←') : '↔';
    const mySide = c.from === s.id ? c.fromSide : c.toSide;
    h += `<button data-goto="${other}"><span class="a">${mySide?(SIDE_SYM[mySide]||'')+' ':''}${arrow} ${os?esc(os.name):'?'}</span>
      <span class="b">${c.open===false?'✕ ':''}${esc(c.name)}${mySide?' · '+esc(sideLabel(mySide)):''}${c.minutes?' · '+esc(c.minutes)+'хв':''}</span></button>`;
  });
  h += `</div></div>`;

  if (locs(s).length){
    h += `<div class="rd"><h4>Кімнати <span>${locs(s).length}</span></h4>`;
    locs(s).forEach(l => {
      const b = blockOnLoc(s, l.id);
      h += `<div class="rdi ${slotList(l).length?'o':isTre(l)?'t':'l'} ${isTre(l)&&l.taken?'off':''}">
        <div class="n" style="color:${locColor(l)}">${locIcon(l)} ${esc(locName(l))}${
          isTre(l)&&l.taken?' <span class="tag">забрано</span>':''}${
          slotList(l).slice(1).map(x => ` <span class="tag">${esc(x.r.one||x.r.nm)} ${esc(x.it.nm)}</span>`).join('')}</div>
        ${l.notes?`<div class="w">${esc(l.notes)}</div>`:''}
        ${isTre(l)&&l.tre?`<div class="k"><b>Скарб:</b> ${esc(l.tre)}</div>`:''}
        ${isTre(l)&&l.guard?`<div class="k"><b>Захисник:</b> ${esc(l.guard)}</div>`:''}
        ${b?`<div class="k"><b>Перекрита:</b> ${esc(b.nm)}${b.done?' (вирішено)':''}${
            b.src && scene(b.src) ? ` · ключ ${srcRef(b)}` : ''}</div>`:''}
        ${renderLinks(l)}
        ${(() => { const k = owe.filter(o => o.it.srcLoc === l.id);
            return k.length ? `<div class="k"><b>Рішення для інших сцен:</b> ${k.map(o =>
              `${esc(o.it.nm)} (<button class="linkbtn" data-goto="${o.from.id}">${esc(o.from.name)}</button>)`).join(', ')}</div>` : ''; })()}</div>`;
    });
    h += `</div>`;
  }

  if (s.dangers.length){
    h += `<div class="rd"><h4>Небезпеки <span>${s.dangers.filter(d=>d.active!==false).length} активних</span></h4>`;
    s.dangers.forEach(d => {
      h += `<div class="rdi d ${d.active===false?'off':''}">
        <div class="n">${esc(d.nm)} <span style="color:var(--blood);font-size:11px">${lvlDots(d.lvl)}</span>
          ${d.active===false?'<span class="tag">вимкнена</span>':''}</div>
        ${d.what?`<div class="w">${esc(d.what)}</div>`:''}
        ${d.fix?`<div class="k"><b>Знімається:</b> ${esc(d.fix)}</div>`:''}
        ${d.src?`<div class="k">${srcRef(d)}</div>`:''}</div>`;
    });
    h += `</div>`;
  }

  if (s.blocks.length){
    h += `<div class="rd"><h4>Блоки <span>${s.blocks.filter(b=>!b.done).length} відкритих</span></h4>`;
    s.blocks.forEach(b => {
      h += `<div class="rdi b ${b.done?'off':''}">
        <div class="n">${esc(b.nm)}${(() => { const l = blockTargetLabel(s, b);
            return l ? ` <span class="tag">перекриває: ${esc(l)}</span>` : ''; })()}
          ${b.done?'<span class="tag">вирішено</span>':''}</div>
        ${b.what?`<div class="w">${esc(b.what)}</div>`:''}
        ${b.key?`<div class="k"><b>Ключ:</b> ${esc(b.key)}</div>`:''}
        ${b.src?`<div class="k"><b>Де шукати:</b> ${srcRef(b)}</div>`:''}</div>`;
    });
    h += `</div>`;
  }

  if (s.events.length){
    h += `<div class="rd"><h4>Івенти <span>${s.events.filter(e=>!e.fired).length} не спрацювали</span></h4>`;
    s.events.forEach(e => {
      const c = e.conn ? conn(e.conn) : null;
      const o = c ? scene(c.from === s.id ? c.to : c.from) : null;
      h += `<div class="rdi e ${e.fired?'off':''}">
        <div class="n">${esc(e.nm)}${e.fired?' <span class="tag">спрацював</span>':''}</div>
        ${e.trig?`<div class="k"><b>Тригер:</b> ${esc(e.trig)}</div>`:''}
        ${e.eff?`<div class="w">${esc(e.eff)}</div>`:''}
        ${c?`<div class="k">${e.act==='close'?'закриває':'відкриває'} перехід
             <button class="linkbtn" data-selconn="${c.id}">${esc(c.name)}</button>
             ${o?`→ <button class="linkbtn" data-goto="${o.id}">${esc(o.name)}</button>`:''}</div>`:''}</div>`;
    });
    h += `</div>`;
  }

  h += `<div class="rd"><h4>Ця сцена розв'язує <span>${owe.length}</span></h4>`;
  if (!owe.length) h += `<div class="empty">Нічого. Жодна інша сцена не залежить від цієї.</div>`;
  owe.forEach(o => {
    const solved = o.kind === 'danger' ? o.it.active === false : !!o.it.done;
    h += `<div class="rdi o ${solved?'off':''}">
      <div class="n">${o.kind==='danger'?'☠':'⛔'} ${esc(o.it.nm)}${solved?' <span class="tag">закрито</span>':''}</div>
      <div class="w">${esc(o.kind==='danger' ? o.it.fix : o.it.key)}</div>
      ${owedLoc(s, o.it) ? `<div class="k"><b>Тут:</b> ${owedLoc(s, o.it)}</div>` : ''}
      <div class="k">для <button class="linkbtn" data-goto="${o.from.id}">${esc(o.from.name)}</button></div></div>`;
  });
  h += `</div>`;

  if (s.counters.length) h += `<div class="rd"><h4>Лічильники</h4>${ctrRow(s,'s')}</div>`;

  if (toks.length){
    h += `<div class="rd"><h4>Токени <span>${toks.length}</span></h4><div class="row">`;
    toks.forEach(t => { const c = t.color || (TOKTYPE[t.type]||TOKTYPE.other).c;
      h += `<span class="chip" style="border-color:${esc(c)};color:${esc(c)}">${esc(t.name)}${t.hp?' · '+esc(t.hp):''}</span>`; });
    h += `</div></div>`;
  }

  return h + `</div>`;
}

function readConn(c){
  if (!c) return '';
  const a = scene(c.from), b = scene(c.to);
  const toks = S.tokens.filter(t => t.at && t.at.kind === 'conn' && t.at.id === c.id);
  let h = `<div class="ihead"><div class="t">${esc(c.name)}</div>
    <div class="s">${c.dir==='one'?'однобічний':'двосторонній'}${c.open===false?' · закритий':''}${c.minutes?' · '+esc(c.minutes)+' хв':''}</div></div>
    <div class="ipad"><div class="rd"><h4>Веде</h4><div class="jump">
      <button data-goto="${c.from}"><span class="a">${a?esc(a.name):'?'}</span><span class="b">початок${
        c.fromSide?' · вихід на '+esc(sideLabel(c.fromSide)):''}</span></button>
      <button data-goto="${c.to}"><span class="a">${b?esc(b.name):'?'}</span><span class="b">${c.dir==='one'?'тільки сюди':'кінець'}${
        c.toSide?' · вхід з '+esc(sideLabel(c.toSide)):''}</span></button>
    </div></div>`;
  if (c.desc) h += `<div class="rd"><h4>Як працює</h4><div style="color:#CBD3C9">${esc(c.desc)}</div></div>`;
  if (c.counters.length) h += `<div class="rd"><h4>Лічильники</h4>${ctrRow(c,'c')}</div>`;
  if (toks.length){
    h += `<div class="rd"><h4>Токени</h4><div class="row">`;
    toks.forEach(t => { const col = t.color || (TOKTYPE[t.type]||TOKTYPE.other).c;
      h += `<span class="chip" style="border-color:${esc(col)};color:${esc(col)}">${esc(t.name)}</span>`; });
    h += `</div></div>`;
  }
  return h + `</div>`;
}

function inspConn(c){
  if (!c) return '';
  const a = scene(c.from), b = scene(c.to);
  const toks = S.tokens.filter(t => t.at && t.at.kind === 'conn' && t.at.id === c.id);
  let h = `<div class="ihead"><div class="t">${esc(c.name)}</div>
    <div class="s">Зовнішнє з'єднання</div></div><div class="ipad">`;
  h += `<fieldset><legend>Кінці</legend>
    <div class="row" style="justify-content:space-between">
      <button class="linkbtn" data-goto="${c.from}">${a?esc(a.name):'?'}</button>
      <span>${c.dir === 'one' ? '→' : '↔'}</span>
      <button class="linkbtn" data-goto="${c.to}">${b?esc(b.name):'?'}</button>
    </div>
    <button class="btn sm" data-swap="${c.id}" style="margin-top:7px">Поміняти напрям місцями</button>
  </fieldset>`;
  h += `<fieldset><legend>Властивості</legend>
    <label class="f"><span>Назва</span><input type="text" data-path="c:${c.id}:name" value="${esc(c.name)}"></label>
    <div class="grid2">
      <label class="f"><span>Тип</span><select data-path="c:${c.id}:dir">
        <option value="two"${c.dir==='two'?' selected':''}>двосторонній</option>
        <option value="one"${c.dir==='one'?' selected':''}>однобокий</option></select></label>
      <label class="f"><span>Хвилин на перехід</span><input type="number" min="0" data-num="1" data-path="c:${c.id}:minutes" value="${esc(c.minutes)}"></label>
    </div>
    <div class="grid2">
      <label class="f"><span>Виходить із «${esc(a?a.name:'?')}» на</span>
        <select data-path="c:${c.id}:fromSide">
          ${SIDES.map(([v,t]) => `<option value="${v}"${c.fromSide===v?' selected':''}>${SIDE_SYM[v]?SIDE_SYM[v]+' ':''}${esc(t)}</option>`).join('')}
        </select></label>
      <label class="f"><span>Входить у «${esc(b?b.name:'?')}» з</span>
        <select data-path="c:${c.id}:toSide">
          ${SIDES.map(([v,t]) => `<option value="${v}"${c.toSide===v?' selected':''}>${SIDE_SYM[v]?SIDE_SYM[v]+' ':''}${esc(t)}</option>`).join('')}
        </select></label>
    </div>
    <label class="f"><span>Як працює</span><textarea data-path="c:${c.id}:desc">${esc(c.desc)}</textarea></label>
    <label class="tgl"><input type="checkbox" data-path="c:${c.id}:open" ${c.open!==false?'checked':''}> прохід відкритий</label>
    <div class="row" style="margin-top:8px">
      <select class="btn sm" data-tpl="conn" data-id="${c.id}" style="width:auto">
        <option value="">з заготовки…</option>${TPL_CONN.map((t,i)=>`<option value="${i}">${esc(t.nm)}</option>`).join('')}</select>
      <button class="x" data-del-conn="${c.id}">Видалити</button>
    </div></fieldset>`;
  h += `<fieldset><legend>Лічильники переходу</legend>`;
  if (!c.counters.length) h += `<div class="empty">Немає. Наприклад: «проходів», «хвилин витрачено», «союзників пройшло».</div>`;
  c.counters.forEach(k => h += `<div class="ih"><input type="text" data-path="c:${c.id}:counters:${k.id}:label" value="${esc(k.label)}">
      <input type="number" style="width:70px" data-num="1" data-path="c:${c.id}:counters:${k.id}:value" value="${k.value}">
      <button class="x" data-del="c:${c.id}:counters:${k.id}">✕</button></div>`);
  h += `<button class="btn sm" data-add="conncounter" data-id="${c.id}">+ лічильник</button></fieldset>`;
  h += `<fieldset><legend>Токени на переході · ${toks.length}</legend>`;
  if (!toks.length) h += `<div class="empty">Порожньо. Перетягніть токен на підпис з'єднання.</div>`;
  toks.forEach(t => h += `<div><button class="linkbtn" data-seltoken="${t.id}">${esc(t.name)}</button></div>`);
  h += `</fieldset></div>`;
  return h;
}

function inspToken(t){
  if (!t) return '';
  const loc = t.at ? (t.at.kind === 'scene' ? scene(t.at.id) : conn(t.at.id)) : null;
  let h = `<div class="ihead"><div class="t">${esc(t.name)}</div>
    <div class="s">Токен · ${esc((TOKTYPE[t.type]||TOKTYPE.other).nm)}</div></div><div class="ipad">`;
  h += `<fieldset><legend>Токен</legend>
    <label class="f"><span>Назва</span><input type="text" data-path="t:${t.id}:name" value="${esc(t.name)}"></label>
    <div class="grid2">
      <label class="f"><span>Тип</span><select data-path="t:${t.id}:type">
        ${Object.entries(TOKTYPE).map(([k,v]) => `<option value="${k}"${t.type===k?' selected':''}>${esc(v.nm)}</option>`).join('')}
      </select></label>
      <label class="f"><span>Колір</span><input type="color" data-path="t:${t.id}:color" value="${esc(t.color||(TOKTYPE[t.type]||TOKTYPE.other).c)}"></label>
    </div>
    <label class="f"><span>HP / стан</span><input type="text" data-path="t:${t.id}:hp" value="${esc(t.hp||'')}"></label>
    <label class="f"><span>Нотатки</span><textarea data-path="t:${t.id}:notes">${esc(t.notes||'')}</textarea></label>
  </fieldset>`;
  h += `<fieldset><legend>Розташування</legend>
    <div>${loc ? (t.at.kind === 'scene'
        ? `<button class="linkbtn" data-goto="${loc.id}">→ ${esc(loc.name)}</button>`
        : `<button class="btn sm" data-selconn="${loc.id}">на з'єднанні «${esc(loc.name)}»</button>`)
      : `<span class="empty">поза дошкою</span>`}</div>
    <label class="f" style="margin-top:7px"><span>Перемістити у сцену</span>
      <select data-movetok="${t.id}">${sceneOptions(t.at&&t.at.kind==='scene'?t.at.id:'', true)}</select></label>
    <p class="hint">Або просто перетягніть токен по дошці.</p>
    <button class="x" data-del-token="${t.id}">Видалити токен</button></fieldset></div>`;
  return h;
}
</script>
<script>
"use strict";
/* ============================================================
   Ліва панель
   ============================================================ */
let tab = 'scenes';
function renderRail(){
  renderTabs();
  renderPaneScenes();
  renderPaneTokens();
  renderRegPanes();
  showTab();
}
function renderTabs(){
  const nav = document.getElementById('tabs');
  let h = `<button data-p="scenes">Сцени</button><button data-p="tokens">Токени</button>`;
  regs().forEach(r => h += `<button data-p="reg-${r.id}">${r.sym||''} ${esc(r.nm)}</button>`);
  h += `<button class="plus eonly" data-addreg title="Новий список локацій">＋</button>`;
  nav.innerHTML = h;
}
function showTab(){
  if (tab.startsWith('reg-') && !reg(tab.slice(4))) tab = 'scenes';
  document.querySelectorAll('#tabs button[data-p]').forEach(b => b.classList.toggle('on', b.dataset.p === tab));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + tab));
}
function renderRegPanes(){
  const box = document.getElementById('panes');
  const want = new Set(regs().map(r => 'p-reg-' + r.id));
  box.querySelectorAll('.pane[id^="p-reg-"]').forEach(el => { if (!want.has(el.id)) el.remove(); });
  regs().forEach(r => {
    let el = document.getElementById('p-reg-' + r.id);
    if (!el){ el = document.createElement('section'); el.className = 'pane'; el.id = 'p-reg-' + r.id; box.appendChild(el); }
    const placed = r.items.filter(it => hostOf(r.id, it.id)).length;
    let h = `<h3>${r.sym||''} ${esc(r.nm)} · ${placed}/${r.items.length}</h3>
      <p class="hint">Кожен елемент лежить рівно в одній кімнаті. Клік по сцені — перехід на дошку.</p>
      <div class="eonly" style="border:1px solid var(--line);border-radius:5px;padding:7px;margin-bottom:9px">
        <div class="grid2">
          <label class="f"><span>Назва списку</span><input type="text" data-path="r:${r.id}:nm" value="${esc(r.nm)}"></label>
          <label class="f"><span>Значок</span><input type="text" data-path="r:${r.id}:sym" value="${esc(r.sym||'')}"></label>
        </div>
        <div class="grid2">
          <label class="f"><span>Як звати кімнату</span><input type="text" placeholder="${esc(r.nm)}" data-path="r:${r.id}:one" value="${esc(r.one||'')}"></label>
          <label class="f"><span>Колір</span><input type="color" data-path="r:${r.id}:color" value="${esc(r.color||'#C7D6E0')}"></label>
        </div>
        <button class="x" data-delreg="${r.id}">Видалити список</button>
      </div>`;
    if (!r.items.length) h += `<p class="hint">Список порожній.</p>`;
    r.items.forEach(it => {
      const host = hostOf(r.id, it.id);
      h += `<div class="card" style="border-left:3px solid ${esc(r.color||'#54685C')}">
        <div class="cn">${it.sym||r.sym||'◆'} ${esc(it.nm)}</div>
        ${it.note ? `<div class="cs">${esc(it.note)}</div>` : ''}
        <div class="eonly grid2" style="margin-top:5px">
          <input type="text" placeholder="назва" data-path="r:${r.id}:items:${it.id}:nm" value="${esc(it.nm)}">
          <input type="text" placeholder="значок" data-path="r:${r.id}:items:${it.id}:sym" value="${esc(it.sym||'')}">
        </div>
        <input class="eonly" type="text" style="margin-top:4px" placeholder="нотатка" data-path="r:${r.id}:items:${it.id}:note" value="${esc(it.note||'')}">
        <div style="margin-top:5px">${host
          ? `<button class="linkbtn" data-goto="${host.id}">→ ${esc(host.name)}</button>`
          : `<span class="empty">не призначено</span>`}</div>
        <div class="eonly row" style="margin-top:5px">
          <select style="flex:1" data-setitem="${r.id}:${it.id}">
            <option value="">— обрати сцену —</option>${sceneOptions(host?host.id:'', false)}</select>
          <button class="x" data-delitem="${r.id}:${it.id}">✕</button>
        </div>
      </div>`;
    });
    h += `<button class="btn sm eonly" data-additem="${r.id}">+ елемент</button>`;
    el.innerHTML = h;
  });
}

function renderPaneScenes(){
  const el = document.getElementById('p-scenes');
  let h = `<h3>Сцени · ${S.scenes.length}</h3>`;
  if (!S.scenes.length) h += `<p class="hint">Ще немає сцен. Натисніть «+ Сцена» або «Демо-розкладка».</p>`;
  const sorted = [...S.scenes];
  sorted.forEach(s => {
    const act = sel && sel.kind === 'scene' && sel.id === s.id;
    const dg = s.dangers.filter(d => d.active !== false).length;
    const bk = s.blocks.filter(b => !b.done).length;
    const tr = locs(s).filter(l => isTre(l) && !l.taken).length;
    const lc = locs(s).length;
    h += `<div class="card ${act?'act':''}" data-goto="${s.id}" tabindex="0" style="border-left:3px solid ${esc(s.color)}">
      <div class="cn">${esc(s.name)}</div>
      <div class="cs">${s.dm?esc(s.dm)+' · ':''}☠ ${dg} · ◈ ${tr} · ⛔ ${bk}${lc?' · ▣ '+lc:''}</div>
      ${locs(s).length ? `<div class="tagline">${locs(s).map(l =>
        `<span class="tag" style="color:${locColor(l)}">${locIcon(l)} ${esc(locName(l))}</span>`).join('')}</div>` : ''}
    </div>`;
  });
  el.innerHTML = h;
}

function renderPaneTokens(){
  const el = document.getElementById('p-tokens');
  let h = `<h3>Токени · ${S.tokens.length}</h3>
    <p class="hint">Боси, що прорвались крізь Ворота, розвідгрупи, союзники, партії гравців.</p>
    <div class="row eonly" style="margin-bottom:8px">
      <button class="btn sm" data-newtok="boss">+ Бос</button>
      <button class="btn sm" data-newtok="scouts">+ Розвідка</button>
      <button class="btn sm" data-newtok="ally">+ Союзник</button>
      <button class="btn sm" data-newtok="party">+ Група</button>
    </div>
    <label class="f eonly"><span>Швидко: бос із хвилі Воріт</span>
      <select data-bossTpl><option value="">— обрати —</option>${TPL_BOSS.map(b=>`<option>${esc(b)}</option>`).join('')}</select></label>
    <div class="sep"></div>`;
  if (!S.tokens.length) h += `<p class="hint">Токенів немає.</p>`;
  S.tokens.forEach(t => {
    const loc = t.at ? (t.at.kind === 'scene' ? scene(t.at.id) : conn(t.at.id)) : null;
    const c = t.color || (TOKTYPE[t.type]||TOKTYPE.other).c;
    h += `<div class="card" style="border-left:3px solid ${esc(c)}">
      <div class="cn">${esc(t.name)}</div>
      <div class="cs">${esc((TOKTYPE[t.type]||TOKTYPE.other).nm)}${t.hp?' · '+esc(t.hp):''}</div>
      <div style="margin-top:4px">${loc
        ? (t.at.kind === 'scene' ? `<button class="linkbtn" data-goto="${loc.id}">→ ${esc(loc.name)}</button>`
                                 : `<button class="linkbtn" data-selconn="${loc.id}">на «${esc(loc.name)}»</button>`)
        : `<span class="empty">поза дошкою</span>`}
        <button class="btn sm" data-seltoken="${t.id}" style="float:right">ред.</button></div>
    </div>`;
  });
  el.innerHTML = h;
}

/* ============================================================
   Події — делегування
   ============================================================ */
function addItem(kind, id){
  if (kind === 'danger'){ const s = scene(id); s.dangers.push({id:uid('d'), nm:'Небезпека', what:'', fix:'', lvl:2, active:true, src:'', srcLoc:''}); }
  if (kind === 'block'){ const s = scene(id); s.blocks.push({id:uid('b'), nm:'Блок', what:'', key:'', tgtKind:'conn', tgt:'', tgtText:'', src:'', srcLoc:'', done:false}); }
  if (kind === 'loc'){ locs(scene(id)).push(mkLoc()); }
  if (kind === 'loctre'){ locs(scene(id)).push(mkLoc({hasTre:true})); }
  if (kind === 'event'){ const s = scene(id); s.events.push({id:uid('e'), nm:'Івент', trig:'', eff:'', conn:'', act:'open', fired:false}); }
  if (kind === 'counter'){ const s = scene(id); s.counters.push({id:uid('n'), label:'лічильник', value:0}); }
  if (kind === 'conncounter'){ const c = conn(id); c.counters.push({id:uid('n'), label:'проходів', value:0}); }
  if (kind === 'token'){ mkToken('other', 'Токен', {kind:'scene', id}); return; }
  mark(); renderAll();
}
function mkToken(type, name, at){
  const t = {id:uid('t'), name:name || (TOKTYPE[type]||TOKTYPE.other).nm, type, color:(TOKTYPE[type]||TOKTYPE.other).c, hp:'', notes:'', at:at||null};
  S.tokens.push(t); mark(); sel = {kind:'token', id:t.id}; renderAll(); return t;
}

document.addEventListener('click', ev => {
  const t = ev.target;
  const hit = a => t.closest(`[${a}]`);

  let e;
  if ((e = hit('data-goto'))){ focusScene(e.getAttribute('data-goto')); return; }
  if ((e = hit('data-selconn'))){ select('conn', e.getAttribute('data-selconn')); return; }
  if ((e = hit('data-seltoken'))){ select('token', e.getAttribute('data-seltoken')); return; }
  if ((e = hit('data-ctr'))){
    const [w, oid, cid, dv] = e.getAttribute('data-ctr').split(':');
    const host = w === 's' ? scene(oid) : conn(oid);
    const c = host && byId(host.counters, cid);
    if (c){ c.value = (c.value|0) + parseInt(dv,10); mark(); renderBoard(); renderInsp(); }
    return;
  }
  if ((e = hit('data-del'))){ 
    const p = e.getAttribute('data-del').split(':');
    const host = p[0] === 's' ? scene(p[1]) : conn(p[1]);
    if (host) host[p[2]] = host[p[2]].filter(x => x.id !== p[3]);
    mark(); renderAll(); return;
  }
  if ((e = hit('data-del-scene'))){ if (confirm('Видалити сцену разом з її з\'єднаннями?')) delScene(e.getAttribute('data-del-scene')); return; }
  if ((e = hit('data-del-conn'))){ delConn(e.getAttribute('data-del-conn')); return; }
  if ((e = hit('data-del-token'))){ const id = e.getAttribute('data-del-token'); S.tokens = S.tokens.filter(x => x.id !== id); sel = null; mark(); renderAll(); return; }
  if ((e = hit('data-swap'))){ const c = conn(e.getAttribute('data-swap')); [c.from, c.to] = [c.to, c.from]; mark(); renderAll(); return; }
  if ((e = hit('data-addlink'))){
    const [sid, lid] = e.getAttribute('data-addlink').split(':');
    const l = byId(locs(scene(sid)), lid);
    if (l){ locLinks(l).push({id:uid('k'), label:'', url:''}); mark(); renderAll(); }
    return;
  }
  if ((e = hit('data-dellink'))){
    const [sid, lid, kid] = e.getAttribute('data-dellink').split(':');
    const l = byId(locs(scene(sid)), lid);
    if (l){ l.links = locLinks(l).filter(x => x.id !== kid); mark(); renderAll(); }
    return;
  }
  if ((e = hit('data-add'))){ addItem(e.getAttribute('data-add'), e.getAttribute('data-id')); return; }
  if ((e = hit('data-newtok'))){ mkToken(e.getAttribute('data-newtok'), null, sel && sel.kind === 'scene' ? {kind:'scene', id:sel.id} : null); return; }
  if ((e = hit('data-place'))){
    const [sid, rid, iid] = e.getAttribute('data-place').split(':');
    const host = hostOf(rid, iid);
    place(rid, iid, host && host.id === sid ? null : sid);
    renderAll(); return;
  }
  if (t.closest('[data-addreg]')){
    const r = {id:uid('g'), nm:'Новий список', one:'', sym:'◆', color:'#6A9BD1', items:[]};
    regs().push(r); tab = 'reg-' + r.id; mark(); renderAll(); return;
  }
  if ((e = hit('data-delreg'))){
    const rid = e.getAttribute('data-delreg'), r = reg(rid);
    if (!r || !confirm(`Видалити список «${r.nm}» разом із прив'язками?`)) return;
    S.scenes.forEach(s => {
      locs(s).forEach(l => { if (l.reg) delete l.reg[rid]; });
      s.locations = locs(s).filter(l => !locEmpty(l));
    });
    S.registries = regs().filter(x => x.id !== rid);
    tab = 'scenes'; mark(); renderAll(); return;
  }
  if ((e = hit('data-additem'))){
    const r = reg(e.getAttribute('data-additem'));
    if (r){ r.items.push({id:uid('i'), nm:'Новий елемент', sym:'', note:''}); mark(); renderAll(); }
    return;
  }
  if ((e = hit('data-delitem'))){
    const [rid, iid] = e.getAttribute('data-delitem').split(':');
    const r = reg(rid); if (!r) return;
    clearSlot(rid, iid);
    r.items = r.items.filter(x => x.id !== iid);
    mark(); renderAll(); return;
  }
  if ((e = hit('data-act'))){
    const a = e.getAttribute('data-act'), id = e.getAttribute('data-id');
    if (a === 'open') select('scene', id);
    if (a === 'link'){ startLink(id); }
    return;
  }
  if ((e = t.closest('[data-conn]'))){ select('conn', e.getAttribute('data-conn')); return; }
});

/* рівень небезпеки */
document.addEventListener('click', ev => {
  const b = ev.target.closest('.lvl button'); if (!b) return;
  const path = b.parentElement.getAttribute('data-lvl');
  setPath(path + ':lvl', parseInt(b.getAttribute('data-v'),10));
  renderAll();
});

/* зміни в полях */
document.addEventListener('input', ev => {
  const el = ev.target, p = el.getAttribute && el.getAttribute('data-path');
  if (!p) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.num) v = v === '' ? 0 : Number(v);
  setPath(p, v);
  clearTimeout(window.__bt); window.__bt = setTimeout(() => { renderBoard(); renderPaneScenes(); }, 200);
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.hasAttribute && el.hasAttribute('data-fire')){
    const [sid, eid] = el.getAttribute('data-fire').split(':');
    const s = scene(sid), e = s && byId(s.events, eid);
    if (e){
      e.fired = el.checked;
      const c = e.conn ? conn(e.conn) : null;
      if (c) c.open = e.fired ? (e.act !== 'close') : (e.act === 'close');
      mark(); renderAll();
    }
    return;
  }
  if (el.hasAttribute && el.hasAttribute('data-path')){
    const path = el.getAttribute('data-path');
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.num) v = v === '' ? 0 : Number(v);
    setPath(path, v);
    // зміна типу цілі знецінює стару ціль
    if (path.endsWith(':tgtKind')) setPath(path.replace(/:tgtKind$/, ':tgt'), '');
    if (path.endsWith(':src')) setPath(path + 'Loc', '');
    // текстові поля не перебудовують інспектор — інакше губиться фокус
    // при переході з поля в поле
    if (el.tagName === 'SELECT' || el.type === 'checkbox') renderAll();
    else { renderBoard(); renderPaneScenes(); }
    return;
  }
  if (el.hasAttribute && el.hasAttribute('data-setitem')){
    const [rid, iid] = el.getAttribute('data-setitem').split(':');
    place(rid, iid, el.value); renderAll(); return;
  }
  if (el.hasAttribute && el.hasAttribute('data-slot')){
    const [sid, lid, rid] = el.getAttribute('data-slot').split(':');
    const s = scene(sid), l = s && byId(locs(s), lid); if (!l) return;
    if (el.value){ clearSlot(rid, el.value, lid); slots(l)[rid] = el.value; }
    else delete slots(l)[rid];
    mark(); renderAll(); return;
  }
  if (el.hasAttribute && el.hasAttribute('data-movetok')){
    const t = token(el.getAttribute('data-movetok'));
    t.at = el.value ? {kind:'scene', id:el.value} : null;
    mark(); renderAll(); return;
  }
  if (el.hasAttribute && el.hasAttribute('data-bossTpl')){
    if (el.value){ mkToken('boss', el.value + ' (прорвався)', sel && sel.kind === 'scene' ? {kind:'scene', id:sel.id} : null); el.value = ''; }
    return;
  }
  if (el.hasAttribute && el.hasAttribute('data-tpl')){
    const kind = el.getAttribute('data-tpl'), id = el.getAttribute('data-id'), i = el.value;
    if (i === '') return;
    if (kind === 'danger'){ const t = TPL_DANGER[i]; scene(id).dangers.push({id:uid('d'), nm:t.nm, what:t.what, fix:t.fix, lvl:t.lvl, active:true, src:'', srcLoc:''}); }
    if (kind === 'block'){ const t = TPL_BLOCK[i]; scene(id).blocks.push({id:uid('b'), nm:t.nm, what:t.what, key:t.key, tgtKind:'conn', tgt:'', tgtText:'', src:'', srcLoc:'', done:false}); }
    if (kind === 'event'){ const t = TPL_EVENT[i]; scene(id).events.push({id:uid('e'), nm:t.nm, trig:t.trig, eff:t.eff, conn:'', act:'open', fired:false}); }
    if (kind === 'treasure'){ const t = TPL_TREASURE[i];
      locs(scene(id)).push(mkLoc({nm:t.nm, hasTre:true, tre:t.what, guard:t.guard})); }
    if (kind === 'conn'){ const t = TPL_CONN[i]; const c = conn(id); c.name = t.nm; c.dir = t.dir; c.desc = t.desc; }
    el.value = ''; mark(); renderAll(); return;
  }
});

/* ============================================================
   Режим з'єднання
   ============================================================ */
function startLink(fromId){
  if (mode === 'view') return;
  linkMode = {from:fromId || null};
  wrap.classList.add('linking');
  document.getElementById('modeBar').classList.add('on');
  document.getElementById('modeBar').textContent = fromId
    ? `Оберіть другу сцену для з'єднання з «${scene(fromId).name}». Esc — скасувати.`
    : `Оберіть сцену-джерело, потім сцену-ціль. Esc — скасувати.`;
  document.getElementById('bLink').classList.add('on');
}
function stopLink(){
  linkMode = null; wrap.classList.remove('linking');
  document.getElementById('modeBar').classList.remove('on');
  document.getElementById('bLink').classList.remove('on');
}

/* ============================================================
   Взаємодія з дошкою: панорама, зум, перетягування
   ============================================================ */
let drag = null;

wrap.addEventListener('pointerdown', ev => {
  if (ev.button === 2) return;
  const tokEl = ev.target.closest('.tok');
  const head = ev.target.closest('.node .head');
  const nodeE = ev.target.closest('.node');

  if (linkMode){
    if (nodeE){
      const id = nodeE.dataset.scene;
      if (!linkMode.from){ startLink(id); }
      else { const c = newConn(linkMode.from, id); stopLink(); renderAll(); if (c) select('conn', c.id); }
      ev.preventDefault();
    } else if (!ev.target.closest('#hud')) { stopLink(); }
    return;
  }

  if (tokEl){
    const t = token(tokEl.dataset.token); if (!t) return;
    const ghost = tokEl.cloneNode(true);
    ghost.classList.add('ghost');
    ghost.style.left = ev.clientX + 8 + 'px'; ghost.style.top = ev.clientY + 8 + 'px';
    document.body.appendChild(ghost);
    drag = {kind:'token', id:t.id, ghost};
    wrap.setPointerCapture(ev.pointerId);
    ev.preventDefault(); ev.stopPropagation();
    return;
  }

  if (head && nodeE){
    const s = scene(nodeE.dataset.scene);
    select('scene', s.id);
    const el = nodeEl(s.id) || nodeE;
    const w0 = screenToWorld(ev.clientX, ev.clientY);
    drag = {kind:'node', id:s.id, dx:w0.x - s.x, dy:w0.y - s.y, el, moved:false,
            ox:s.x, oy:s.y, raf:0};
    el.style.willChange = 'transform';
    wrap.setPointerCapture(ev.pointerId);
    ev.preventDefault();
    return;
  }

  if (ev.target.closest('[data-ctr], .mini, .ctr, .elabel, #hud, [data-conn]')) return;
  if (nodeE){ select('scene', nodeE.dataset.scene); return; }

  drag = {kind:'pan', sx:ev.clientX, sy:ev.clientY, cx:cam.x, cy:cam.y, moved:false};
  wrap.classList.add('panning');
  wrap.setPointerCapture(ev.pointerId);
});

wrap.addEventListener('pointermove', ev => {
  if (!drag) return;
  if (drag.kind === 'pan'){
    cam.x = drag.cx + (ev.clientX - drag.sx);
    cam.y = drag.cy + (ev.clientY - drag.sy);
    if (Math.abs(ev.clientX - drag.sx) + Math.abs(ev.clientY - drag.sy) > 3) drag.moved = true;
    applyCam();
  } else if (drag.kind === 'node'){
    drag.px = ev.clientX; drag.py = ev.clientY; drag.moved = true;
    if (!drag.raf) drag.raf = requestAnimationFrame(() => {
      drag.raf = 0;
      const w = screenToWorld(drag.px, drag.py);
      const s = scene(drag.id); if (!s) return;
      s.x = Math.round((w.x - drag.dx)/8)*8; s.y = Math.round((w.y - drag.dy)/8)*8;
      drag.el.style.transform = `translate(${s.x - drag.ox}px,${s.y - drag.oy}px)`;
      moveEdgesOf(s.id);
    });
  } else if (drag.kind === 'token'){
    drag.ghost.style.left = ev.clientX + 8 + 'px';
    drag.ghost.style.top = ev.clientY + 8 + 'px';
  }
});

wrap.addEventListener('pointerup', ev => {
  if (!drag) return;
  if (drag.kind === 'token'){
    drag.ghost.remove();
    const under = document.elementFromPoint(ev.clientX, ev.clientY);
    const n = under && under.closest('.node');
    const cEl = under && under.closest('[data-conn]');
    const t = token(drag.id);
    if (n) t.at = {kind:'scene', id:n.dataset.scene};
    else if (cEl) t.at = {kind:'conn', id:cEl.getAttribute('data-conn')};
    else if (under && under.closest('#boardWrap')) t.at = null;
    mark(); drag = null; renderAll(); return;
  }
  if (drag.kind === 'node'){
    if (drag.raf) cancelAnimationFrame(drag.raf);
    const s = scene(drag.id);
    drag.el.style.willChange = '';
    drag.el.style.transform = '';
    if (s){ drag.el.style.left = s.x + 'px'; drag.el.style.top = s.y + 'px'; moveEdgesOf(s.id); }
    if (drag.moved) mark();
  }
  wrap.classList.remove('panning');
  drag = null;
});
wrap.addEventListener('pointercancel', () => { if (drag && drag.ghost) drag.ghost.remove(); drag = null; wrap.classList.remove('panning'); });

wrap.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = wrap.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const k = Math.exp(-ev.deltaY * 0.0016);
  const nz = Math.min(2.2, Math.max(.2, cam.z * k));
  cam.x = mx - (mx - cam.x) * (nz/cam.z);
  cam.y = my - (my - cam.y) * (nz/cam.z);
  cam.z = nz; applyCam();
}, {passive:false});

wrap.addEventListener('dblclick', ev => {
  if (mode === 'view') return;
  if (ev.target.closest('.node') || ev.target.closest('[data-conn]') || ev.target.closest('#hud')) return;
  const w = screenToWorld(ev.clientX, ev.clientY);
  const s = newScene(Math.round((w.x - NODE_W/2)/8)*8, Math.round((w.y - 40)/8)*8);
  renderAll(); select('scene', s.id);
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' || ev.key === ' '){
    const g = ev.target.closest && ev.target.closest('.card[data-goto]');
    if (g){ ev.preventDefault(); focusScene(g.getAttribute('data-goto')); return; }
  }
  if (ev.key === 'Escape'){ if (linkMode) stopLink(); else deselect(); }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (typing) return;
  if (ev.key === 'v'){ setMode(mode === 'view' ? 'edit' : 'view'); return; }
  if (mode === 'view') { if (ev.key === 'f') fitAll(); return; }
  if (ev.key === 'Delete' && sel){
    if (sel.kind === 'scene' && confirm('Видалити сцену?')) delScene(sel.id);
    if (sel.kind === 'conn') delConn(sel.id);
  }
  if (ev.key === 'f') fitAll();
  if (ev.key === 'n') { const w = screenToWorld(innerWidth/2, innerHeight/2); const s = newScene(w.x-118, w.y-50); renderAll(); select('scene', s.id); }
});

/* ============================================================
   Панель зверху
   ============================================================ */
document.getElementById('bAddScene').onclick = () => {
  const r = wrap.getBoundingClientRect();
  const w = screenToWorld(r.left + r.width/2, r.top + r.height/2);
  const s = newScene(Math.round(w.x - NODE_W/2), Math.round(w.y - 50));
  renderAll(); select('scene', s.id);
};
document.getElementById('bLink').onclick = () => { linkMode ? stopLink() : startLink(sel && sel.kind === 'scene' ? sel.id : null); };
document.getElementById('bFit').onclick = fitAll;
function setMode(m){
  mode = m;
  document.body.classList.toggle('view', m === 'view');
  document.getElementById('bMode').textContent = m === 'view' ? '✎ Режим редагування' : '👁 Режим перегляду';
  if (m === 'view') stopLink();
  renderAll();
}
document.getElementById('bMode').onclick = () => setMode(mode === 'view' ? 'edit' : 'view');
document.getElementById('zIn').onclick = () => { cam.z = Math.min(2.2, cam.z*1.2); applyCam(); };
document.getElementById('zOut').onclick = () => { cam.z = Math.max(.2, cam.z/1.2); applyCam(); };
document.getElementById('zRst').onclick = () => { cam.z = 1; applyCam(); };

document.getElementById('tabs').addEventListener('click', ev => {
  const b = ev.target.closest('#tabs button[data-p]');
  if (!b) return;
  tab = b.dataset.p; showTab();
});

/* ---------- експорт / імпорт ---------- */
document.getElementById('bExport').onclick = () => {
  const data = JSON.parse(JSON.stringify(S));
  data.camera = {x:cam.x, y:cam.y, z:cam.z};
  data.ui = S.ui || {};
  data.exportedAt = new Date().toISOString();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dungeon-board-' + new Date().toISOString().slice(0,16).replace(/[:T]/g,'-') + '.json';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  dirty = false; toast('JSON збережено');
};
document.getElementById('bImport').onclick = () => document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      loadState(d);
      toast(`Завантажено: ${S.scenes.length} сцен, ${S.connections.length} з'єднань, ${S.tokens.length} токенів`);
    } catch(err){ alert('Не вдалося прочитати файл: ' + err.message); }
    e.target.value = '';
  };
  fr.readAsText(f);
};
function loadState(d){
  if (!d || !Array.isArray(d.scenes)) throw new Error('це не файл дошки (немає масиву scenes)');
  S = blank();
  S.title = d.title || S.title;
  S.seq = d.seq || 1;
  S.ui = d.ui && typeof d.ui === 'object' ? d.ui : {};
  S.registries = Array.isArray(d.registries) && d.registries.length
    ? d.registries.map(r => ({
        id:r.id || uid('g'), nm:r.nm || 'Список', one:r.one || '', sym:r.sym || '◆',
        color:r.color || '#C7D6E0',
        items:(r.items || []).map(it => ({id:it.id || uid('i'), nm:it.nm || '', sym:it.sym || '', note:it.note || ''})),
      }))
    : defaultRegs();
  S.scenes = d.scenes.map(s => ({
    id:s.id, name:s.name||'Сцена', dm:s.dm||'', color:s.color||'#54685C',
    x:s.x|0, y:s.y|0, notes:s.notes||'',
    dangers:(s.dangers||[]).map(x => ({id:x.id||uid('d'), nm:x.nm||'', what:x.what||'', fix:x.fix||'', lvl:x.lvl||1, active:x.active!==false, src:x.src||'', srcLoc:x.srcLoc||''})),
    blocks:(s.blocks||[]).map(x => ({id:x.id||uid('b'), nm:x.nm||'', what:x.what||'', key:x.key||'',
      tgtKind:({'скарб':'loc','прохід':'conn','кімнату':'loc','гробницю':'loc','treasure':'loc','god':'loc','toa':'loc'}[x.tgtKind || x.kind]) || x.tgtKind || 'conn',
      tgt:x.tgt||'', tgtText:x.tgtText||'', src:x.src||'', srcLoc:x.srcLoc||'', done:!!x.done,
      _oldTgtKind:x.tgtKind || x.kind || ''})),
    events:(s.events||[]).map(x => ({id:x.id||uid('e'), nm:x.nm||'Івент', trig:x.trig||'', eff:x.eff||'',
      conn:x.conn||'', act:x.act==='close'?'close':'open', fired:!!x.fired})),
    locations:[
        ...(s.locations || [
          ...(s.gods||[]).map(g => ({kind:'god', ref:g})),
          ...(s.keys||[]).map(k => ({kind:'key', ref:k})),
        ]),
        // старі окремі скарби стають кімнатами зі скарбом
        ...((s.treasures||[]).map(t => ({
          kind:'treasure', nm:t.nm||'Скарб', notes:'', tre:t.what||'', guard:t.guard||'',
          taken:!!t.done, _oldId:t.id, _oldBlock:t.block||''}))),
      ].map(l => ({
        id:l.id||uid('l'), nm:l.nm||'', notes:l.notes||'',
        reg:Object.assign({},
          l.reg || null,
          (l.god || l.kind === 'god') ? {gods:l.god || l.ref || ''} : null,
          (l.key || l.kind === 'key') ? {keys:l.key || l.ref || ''} : null),
        hasTre:l.hasTre != null ? !!l.hasTre : l.kind === 'treasure',
        tre:l.tre||'', guard:l.guard||'', taken:!!l.taken,
        links:(l.links||[]).map(k => ({id:k.id||uid('k'), label:k.label||'', url:k.url||''})),
        _oldId:l._oldId||'', _oldBlock:l._oldBlock||''})),
    counters:(s.counters||[]).map(x => ({id:x.id||uid('n'), label:x.label||'лічильник', value:x.value|0})),
  }));
  S.scenes.forEach(s => locs(s).forEach(l => {
    Object.keys(l.reg || {}).forEach(k => { if (!l.reg[k]) delete l.reg[k]; });
  }));
  // перепривʼязати старі цілі блоків на нові локації
  S.scenes.forEach(s => {
    const byOld = {};
    locs(s).forEach(l => { if (l._oldId) byOld[l._oldId] = l.id; });
    s.blocks.forEach(b => {
      if (b._oldTgtKind === 'treasure' && byOld[b.tgt]) b.tgt = byOld[b.tgt];
      else if (b._oldTgtKind === 'god'){
        const l = locs(s).find(x => slots(x).gods === b.tgt); b.tgt = l ? l.id : '';
      } else if (b._oldTgtKind === 'toa' || b._oldTgtKind === 'кімнату') b.tgt = '';
      delete b._oldTgtKind;
    });
    locs(s).forEach(l => {
      if (l._oldBlock){
        const b = s.blocks.find(x => x.id === l._oldBlock);
        if (b && !b.tgt){ b.tgtKind = 'loc'; b.tgt = l.id; }
      }
      delete l._oldId; delete l._oldBlock;
    });
  });
  S.connections = (d.connections||[]).map(c => ({
    id:c.id||uid('c'), from:c.from, to:c.to, name:c.name||"З'єднання", dir:c.dir==='one'?'one':'two',
    fromSide:c.fromSide||'', toSide:c.toSide||'',
    desc:c.desc||'', minutes:c.minutes==null?1:c.minutes, open:c.open!==false,
    counters:(c.counters||[]).map(x => ({id:x.id||uid('n'), label:x.label||'проходів', value:x.value|0})),
  })).filter(c => scene(c.from) && scene(c.to));
  S.tokens = (d.tokens||[]).map(t => ({
    id:t.id||uid('t'), name:t.name||'Токен', type:t.type||'other', color:t.color||'',
    hp:t.hp||'', notes:t.notes||'', at:t.at&&t.at.id?t.at:null,
  }));
  const maxSeq = 1 + Math.max(0, ...[...S.scenes, ...S.connections, ...S.tokens]
    .map(o => parseInt(String(o.id).replace(/^\D+/,''),10) || 0));
  S.seq = Math.max(S.seq, maxSeq);
  sel = null; dirty = false;
  applyPanels();
  renderAll();
  if (d.camera){ cam.x = d.camera.x; cam.y = d.camera.y; cam.z = d.camera.z; applyCam(); }
  else fitAll();
}

document.getElementById('bClear').onclick = () => {
  if (!confirm('Очистити дошку? Незбережені дані буде втрачено.')) return;
  S = blank(); sel = null; dirty = false; renderAll(); fitAll();
};

/* ---------- демо-розкладка ---------- */
document.getElementById('bDemo').onclick = () => {
  if (S.scenes.length && !confirm('Замінити поточну дошку демо-розкладкою?')) return;
  S = blank(); sel = null;
  const DM = ['Бобер','Саша','Шкарпетка','Азварія','Прамисел','Ворон'];
  const plan = [
    ['Гнилі зали',          ['Обеліск Ацерерака','Галерея трикстерів','Велетенські сходи']],
    ['Затоплені тунелі',    ['Підземна річка','Кам\'яний череп','Водоспад']],
    ['Підземелля обману',   ['Кільце тяжіння','Фальшива гробниця','Двері з зомбі']],
    ['Кузня могильних дворфів', ['Ковальня','Кабінет наглядача','Спіральні сходи']],
    ['Дзеркальна зала',     ['Дзеркальний коридор','Завіса води','Обертові лази']],
    ['Зала протистояння',   ['Купіль','Порожня комора']],
    ['Яма големів',         ['Яма','Статуї богів']],
    ['Зали жаху',           ['Стихійні камери','Лігво ящірок']],
    ['Тронна зала',         ['Трон із кісток','Крипта Сонячної Королеви']],
    ['Шестерні ненависті',  ['Кімната керування','Гниле коло','Кислотне коло']],
    ['Підземне озеро',      ['Озеро','Двері-пожирач']],
    ['Колиска бога смерті', ['Лігво Зшитих Сестер','Каплиця ненависті','Ебонова купіль']],
  ];
  plan.forEach((P, i) => {
    const col = i % 4, row = Math.floor(i / 4);
    const s = newScene(80 + col*340, 80 + row*320,
      {name:P[0], dm:DM[i % DM.length], color:SCENE_COLORS[i % SCENE_COLORS.length]});
    P[1].forEach(nm => locs(s).push(mkLoc({nm})));
  });
  // дев'ять гробниць і п'ять ключів по сценах
  GODS.forEach((g, i) => place('gods', g.id, S.scenes[i % S.scenes.length].id));
  KEYS.forEach((k, i) => place('keys', k.id, S.scenes[(i*2 + 1) % S.scenes.length].id));
  // кімнати зі скарбом із заготовок
  TPL_TREASURE.forEach((t, i) => {
    const s = S.scenes[(i*2) % S.scenes.length];
    locs(s).push(mkLoc({nm:t.nm, hasTre:true, tre:t.what, guard:t.guard}));
  });
  // з'єднання: рядами і між рядами
  const link = (a, b, nm, fs, ts) => {
    const c = newConn(S.scenes[a].id, S.scenes[b].id);
    if (c){ c.name = nm; c.fromSide = fs || ''; c.toSide = ts || ''; c.minutes = 1; }
    return c;
  };
  for (let r = 0; r < 3; r++)
    for (let c = 0; c < 3; c++) link(r*4+c, r*4+c+1, 'Коридор', 'E', 'W');
  for (let c = 0; c < 4; c++)
    for (let r = 0; r < 2; r++) link(r*4+c, (r+1)*4+c, 'Сходи вниз', 'S', 'N');
  link(0, 5, 'Повільний портал', 'SE', 'NW');
  const alt = link(1, 2, 'Вузька щілина', 'SE', 'SW'); if (alt) alt.desc = TPL_CONN[1].desc;
  // приклад зв'язків між сценами
  const s0 = S.scenes[0], s2 = S.scenes[2], s3 = S.scenes[3], s6 = S.scenes[6];
  s0.dangers.push({id:uid('d'), ...TPL_DANGER[0], active:true, src:s3.id, srcLoc:locs(s3)[1].id});
  s0.counters.push({id:uid('n'), label:'хвиля', value:1});
  const gold = locs(s6).find(isTre) || locs(s6)[0];
  s6.blocks.push({id:uid('b'), ...TPL_BLOCK[0], tgtKind:'loc', tgt:gold.id, tgtText:'',
                  src:s2.id, srcLoc:locs(s2)[0].id, done:false});
  s2.events.push({id:uid('e'), ...TPL_EVENT[0], conn:'', act:'open', fired:false});
  mkToken('party','Експедиція А',{kind:'scene', id:s0.id});
  mkToken('scouts','Розвідка союзників',{kind:'scene', id:s2.id});
  mkToken('boss','Wight (прорвався)',{kind:'scene', id:S.scenes[4].id});
  sel = null; renderAll(); fitAll();
  toast('Демо: 12 сцен, дев\'ять гробниць і п\'ять ключів розставлені');
};

/* ============================================================
   Ширина бокових панелей
   ============================================================ */
const mainEl = document.getElementById('main');
const PANEL_DEF = {railW:288, inspW:340};
function setPanel(k, px){
  const lim = k === 'railW' ? [190, 620] : [240, 720];
  const v = Math.round(Math.min(lim[1], Math.max(lim[0], px)));
  mainEl.style.setProperty('--' + k, v + 'px');
  (S.ui || (S.ui = {}))[k] = v;
  drawGrid();
}
function applyPanels(){
  const u = S.ui || {};
  mainEl.style.setProperty('--railW', (u.railW || PANEL_DEF.railW) + 'px');
  mainEl.style.setProperty('--inspW', (u.inspW || PANEL_DEF.inspW) + 'px');
  mainEl.classList.toggle('collapsedL', !!u.hideL);
  mainEl.classList.toggle('collapsedR', !!u.hideR);
  drawGrid();
}
[['gutL','railW','hideL'], ['gutR','inspW','hideR']].forEach(([id, key, hide]) => {
  const g = document.getElementById(id);
  g.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    g.setPointerCapture(ev.pointerId);
    g.classList.add('drag'); document.body.classList.add('resizing');
    const rect = mainEl.getBoundingClientRect();
    const move = e => {
      const px = key === 'railW' ? e.clientX - rect.left : rect.right - e.clientX;
      if ((S.ui || {})[hide]){ (S.ui || (S.ui = {}))[hide] = false; mainEl.classList.remove(id === 'gutL' ? 'collapsedL' : 'collapsedR'); }
      setPanel(key, px); mark();
    };
    const up = () => {
      g.classList.remove('drag'); document.body.classList.remove('resizing');
      g.removeEventListener('pointermove', move); g.removeEventListener('pointerup', up);
    };
    g.addEventListener('pointermove', move); g.addEventListener('pointerup', up);
  });
  g.addEventListener('dblclick', () => {
    const u = S.ui || (S.ui = {});
    u[hide] = !u[hide];
    mark(); applyPanels();
  });
});

window.addEventListener('beforeunload', e => { if (dirty){ e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('resize', () => { drawGrid(); });

/* ============================================================
   Старт
   ============================================================ */
function renderAll(){ renderBoard(); renderInsp(); renderRail(); }
stopLink();
applyPanels();
renderAll();
cam.x = 60; cam.y = 60; applyCam();
</script>
